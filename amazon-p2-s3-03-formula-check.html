    document.querySelectorAll(".slide").forEach((s, k) => s.hidden = k !== cur);
    document.querySelectorAll(".dot").forEach((d, k) => { d.classList.toggle("seen", seen.has(k)); if (k === cur) d.setAttribute("aria-current", "step"); else d.removeAttribute("aria-current"); });
    // aria-disabled, not disabled, so a focused button never drops focus to <body>
    prev.setAttribute("aria-disabled", String(cur === 0));
    next.setAttribute("aria-disabled", String(cur === total - 1));
    $("counter").textContent = `Slide ${cur + 1} of ${total}`;
    try { localStorage.setItem(KEY, cur); } catch (e) {}
    if (focus) { $("status").textContent = ""; setTimeout(() => $("status").textContent = `Slide ${cur + 1} of ${total}: ${S[cur].label}`, 40); $("s" + cur).querySelector("h2").focus(); }
  }
  prev.onclick = () => { if (cur > 0) go(cur - 1, true); };
  next.onclick = () => { if (cur < total - 1) go(cur + 1, true); };
  $("dots").onclick = e => { const b = e.target.closest(".dot"); if (b) go(+b.dataset.i, true); };
  let start = 0; try { start = +localStorage.getItem(KEY) || 0; } catch (e) {}
  go(start, false);
})();
</script>
</body>
</html>
