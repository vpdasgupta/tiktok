<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- title is also set from DECK.title by script; this is the no-JS fallback -->
<title>Decide If a Company Fits the Challenge — Interactive</title>

<!--
  RELEVANCE DECODER — "Decide If a Company Fits the Challenge" (PFNYC Week 1, Step 1.3)
  Self-contained, embeddable HTML activity. A learner reads a short profile of each of
  four real-style companies, picks which DEP challenge it fits (or "Not relevant"), then
  breaks the call down into three steps (What it does / Use case / Verdict) and, as the
  partner at a desk screen, names the step that actually decides keep-or-cut. Two rounds are
  traps (GridGuard vs. LockDesk — same word, opposite verdict).

  CUSTOMISE: edit only the DECK object (search "EDIT BELOW"). Everything under the
  "DO NOT EDIT" banner is the generic slide engine.

  PALETTE: the Extern 5-color light design system, matched to step-02's
  challenges-compare.html. Exactly five tokens (--bg, --highlight, --on-highlight,
  --body, --title). Do not add a sixth — correct/incorrect is carried by TEXT, not color.

  DEPLOY: host on GitHub Pages (github-pages-deployer) and embed in Notion via
  <embed src="https://…/pfnyc-relevance-decoder.html">. Notion's embed can't set an
  iframe title — known platform residual (WCAG 2.4.1/4.1.2); the in-page <title> mitigates.

  ACCESSIBILITY (WCAG 2.2 AA — reviewed by the accessibility-lead team):
  focus moves to each slide heading on change; inactive slides are hidden (out of tab
  order + a11y tree); a persistent polite live region announces picks, results, gate
  state and slide position; the challenge picker and the parts picker are real radiogroups
  (role=radiogroup, aria-checked, roving tabindex); the challenge picker commits on
  Space/Enter so arrowing never spoils the answer; correct/incorrect is conveyed by TEXT
  (never color) plus a decorative check/cross; Next uses aria-disabled + a described reason
  and unlocks on any pick; at ≤640px / 400% zoom the fixed canvas becomes a fluid scrolling
  stack; reduced motion is honored. Keep these intact — they are requirements, not polish.
-->

<style>
  /* ---------------------------------------------------------------
     Extern design system. These five values are the entire palette.
     Do not add a sixth.
     --------------------------------------------------------------- */
  :root{
    --highlight:#DCE1FF;    /* cards, panels, highlighted blocks   */
    --on-highlight:#001D69; /* accents, active state, nav buttons  */
    --bg:#FDF8F8;           /* canvas background, negative space   */
    --body:#484646;         /* body copy, captions                 */
    --title:#1C1B1B;        /* headings, primary text              */

    --t-fast:160ms;
    --t-frame:300ms;
    --ease-out:cubic-bezier(.2,.7,.3,1);
    font-size:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg)}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--body)}

  /* visually-hidden but available to assistive tech */
  .sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  /* focus ring — navy on light surfaces */
  a:focus-visible,button:focus-visible,input:focus-visible,
  [role="radio"]:focus-visible,[tabindex]:focus{
    outline:2px solid var(--on-highlight);outline-offset:2px;border-radius:8px}
  /* on navy-filled controls invert: light inner ring + navy outer halo so it shows on the fill */
  .btn:focus-visible,.navbtn:focus-visible{
    outline:2px solid var(--bg);outline-offset:-6px;box-shadow:0 0 0 2px var(--on-highlight)}
  /* disabled nav turns bg-colored, so the light inner ring would vanish — repaint navy */
  .navbtn[aria-disabled="true"]:focus-visible{
    outline:2px solid var(--on-highlight);outline-offset:2px;box-shadow:none}

  #deck-wrapper{width:960px;height:540px;overflow:hidden;position:relative;flex-shrink:0;background:var(--bg)}
  .slide{width:960px;height:492px;padding:34px 60px 16px;position:absolute;inset:0;display:none;flex-direction:column;overflow:auto}
  .slide.active{display:flex}

  h1{font-size:2.125rem;font-weight:800;line-height:1.15;color:var(--title)}
  h2{font-size:1.44rem;font-weight:800;color:var(--title)}
  .muted{color:var(--body)}
  .btn{appearance:none;border:2px solid var(--on-highlight);border-radius:10px;padding:11px 19px;
    font-size:.94rem;font-weight:700;cursor:pointer;background:var(--on-highlight);color:var(--bg);
    transition:filter var(--t-fast) var(--ease-out)}
  .btn:hover{text-decoration:underline}                    /* underline only — stay within the 5-color palette */
  .btn.ghost{background:transparent;border:1px solid var(--on-highlight);color:var(--on-highlight)}

  .roundtag{display:inline-block;width:fit-content;font-size:.75rem;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;color:var(--on-highlight);background:var(--highlight);
    border:1px solid var(--on-highlight);padding:4px 11px;border-radius:20px}

  /* ---- bottom nav ---- */
  #nav{position:absolute;left:24px;right:24px;bottom:10px;display:flex;align-items:center;gap:14px;z-index:5}
  .navbtn{appearance:none;border:2px solid var(--on-highlight);background:var(--on-highlight);color:var(--bg);
    border-radius:9px;padding:7px 16px;font-size:.81rem;font-weight:700;cursor:pointer}
  .navbtn:hover{text-decoration:underline}
  .navbtn[aria-disabled="true"]{background:var(--bg);color:var(--body);border-color:var(--body);cursor:not-allowed}
  .navbtn.ready{animation:pu 1.3s var(--ease-out) infinite}   /* motion cue, not color — reduced-motion swaps to a static ring */
  @keyframes pu{50%{transform:translateY(-1px) scale(1.03)}}
  #pos{font-size:.72rem;color:var(--body);font-weight:700;letter-spacing:.03em}
  #dots{display:flex;gap:6px;margin:0 auto}
  .dt{width:7px;height:7px;border-radius:50%;background:transparent;border:1.5px solid var(--body)}
  .dt.on{background:var(--on-highlight);border-color:var(--on-highlight)}

  /* ---- title slide ---- */
  .s-title{justify-content:center;gap:16px}
  .s-title h1{display:flex;align-items:baseline;gap:.3em;flex-wrap:wrap}
  .s-title .emoji{font-size:1.1em}
  .stakes{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px;list-style:none}
  .stake-li{display:flex;align-items:center;gap:8px;margin:0}
  .stake{font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    padding:5px 12px;border-radius:20px;border:1px solid var(--body);color:var(--body);background:transparent}
  .stake.on0,.stake.on1,.stake.on2,.stake.on3{
    border-color:var(--on-highlight);color:var(--on-highlight);background:var(--highlight)}
  .arrow{color:var(--body);font-size:.75rem}

  /* ---- match slide (read a profile, pick the challenge) ---- */
  .qtitle{font-size:1.125rem;font-weight:700;margin:6px 0 12px;color:var(--title)}
  .blurb{font-size:1rem;line-height:1.6;color:var(--title);background:var(--highlight);
    border-left:4px solid var(--on-highlight);border-radius:0 10px 10px 0;padding:14px 18px;max-width:82ch}
  .m-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
  .m-opt{border:1.5px solid var(--body);background:var(--bg);border-radius:11px;padding:12px 15px;
    font-size:.92rem;font-weight:700;color:var(--title);cursor:pointer;display:flex;align-items:flex-start;gap:9px;
    text-align:left;transition:border-color var(--t-fast) var(--ease-out),background var(--t-fast) var(--ease-out)}
  .m-opt:hover{border-color:var(--on-highlight)}
  .m-opt .m-opttext{flex:1;display:flex;flex-direction:column;gap:3px}
  .m-opt .m-optlab{font-weight:800}
  .m-opt .m-optq{font-weight:400;font-size:.76rem;color:var(--body);line-height:1.35}
  .m-opt .chk{margin-left:auto;font-weight:800;font-size:.72rem;color:var(--on-highlight);opacity:0;white-space:nowrap;flex-shrink:0}
  .m-opt[aria-checked="true"]{background:var(--highlight);border-color:var(--on-highlight);
    box-shadow:inset 0 0 0 1px var(--on-highlight)}                 /* extra weight without a layout-shifting border change */
  .m-opt[aria-checked="true"] .chk{opacity:1}
  .m-fb{margin-top:14px;border-radius:11px;padding:13px 16px;font-size:.9rem;line-height:1.5;display:none;
    background:var(--highlight);border:1px solid var(--on-highlight);color:var(--title)}
  .m-fb.show{display:block;animation:in var(--t-frame) var(--ease-out)}
  .m-fb .verdict{display:inline-flex;align-items:center;gap:6px;color:var(--on-highlight)}
  .m-fb .verdict b{color:var(--on-highlight)}
  .fbic{width:18px;height:18px;flex-shrink:0}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1}}

  /* ---- parts slide ---- */
  .parts-head{margin-bottom:12px}
  .parts-head .sub{font-size:.875rem;color:var(--body);margin-top:4px;line-height:1.45}
  .parts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;flex:1;list-style:none}
  .part{border:1px solid var(--on-highlight);border-radius:13px;padding:14px 13px;display:flex;flex-direction:column;
    gap:7px;background:var(--highlight)}
  .part .pic{height:66px;display:flex;align-items:center;justify-content:center}
  .part .pic svg{width:60px;height:60px}
  .part .pname{font-size:.94rem;font-weight:800;letter-spacing:.02em}
  .part .pdef{font-size:.78rem;color:var(--body);line-height:1.4}
  .part .pmap{font-size:.78rem;line-height:1.4;margin-top:auto;padding-top:7px;border-top:1px solid var(--on-highlight)}
  .part .pmap b{color:var(--title)}

  /* ---- second-perspective (partner) slide ---- */
  .a-esc{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:10px}
  .a-esc .stake{font-size:.72rem;padding:4px 10px}
  .a-prompt{font-size:1.06rem;font-weight:700;line-height:1.35;margin-bottom:6px;color:var(--title)}
  .a-prompt b{color:var(--on-highlight)}
  .a-hint{font-size:.81rem;color:var(--body);margin:0 0 12px}
  .a-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .a-opt{border:1.5px solid var(--body);background:var(--bg);border-radius:11px;padding:12px 14px;
    font-size:.9rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:9px;text-align:left;color:var(--title);
    transition:border-color var(--t-fast) var(--ease-out),background var(--t-fast) var(--ease-out)}
  .a-opt:hover{border-color:var(--on-highlight)}
  .a-opt .ic{width:26px;height:26px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .a-opt .ic svg{width:24px;height:24px}
  .a-opt .chk{margin-left:auto;font-weight:800;font-size:.78rem;color:var(--on-highlight);opacity:0}   /* text cue, not color-only */
  .a-opt[aria-checked="true"] .chk{opacity:1}
  .a-opt[aria-checked="true"]{background:var(--highlight);border-color:var(--on-highlight);
    box-shadow:inset 0 0 0 1px var(--on-highlight)}
  .a-fb{margin-top:12px;border-radius:11px;padding:13px 16px;font-size:.9rem;line-height:1.5;display:none;
    background:var(--highlight);border:1px solid var(--on-highlight);color:var(--title)}
  .a-fb.show{display:block;animation:in var(--t-frame) var(--ease-out)}
  .a-fb .stakeline{margin-top:9px;font-size:.84rem;font-weight:800;color:var(--on-highlight)}
  .a-fb .verdict.key,.a-fb .verdict.nokey{color:var(--on-highlight)}
  .a-fb .verdict b{color:var(--on-highlight)}

  /* ---- finale ---- */
  .s-fin{justify-content:center;gap:13px}
  .s-fin h2{color:var(--on-highlight)}
  .s-fin p{font-size:.94rem;line-height:1.6;max-width:820px;color:var(--body)}
  .bridge{font-size:1.06rem;font-weight:700;padding:14px 18px;border-left:4px solid var(--on-highlight);
    background:var(--highlight);border-radius:0 10px 10px 0;line-height:1.5;color:var(--title)}

  /* ================= REFLOW / MOBILE FALLBACK (≤640px CSS width, ≈400% zoom) =================
     Abandon the fixed 960x540 scaled canvas: fluid, vertically-scrolling, ALL slides visible,
     no transform, no gating. Content parity with desktop; nothing dropped. ---------------- */
  @media (max-width:640px){
    html,body{overflow:auto;height:auto}
    #deck-wrapper{width:100%;height:auto;overflow:visible;transform:none!important}
    .slide{position:relative;inset:auto;width:100%;height:auto;min-height:auto;padding:20px 16px 30px;
      display:flex!important;border-bottom:1px solid var(--on-highlight)}
    .parts-grid{grid-template-columns:1fr 1fr;gap:10px;flex:none}
    .part .pic{height:48px}.part .pic svg{width:44px;height:44px}
    .m-opts,.a-opts{grid-template-columns:1fr}
    #nav{display:none}            /* no deck nav in scroll mode */
  }

  /* ================= REDUCED MOTION ================= */
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
    .navbtn.ready{animation:none;outline:2px solid var(--on-highlight);outline-offset:2px}  /* static ready cue */
  }
</style>
</head>
<body>

<!-- persistent live regions: present + empty at load, OUTSIDE the swappable slide DOM -->
<div id="lr-polite" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<div id="lr-alert"  class="sr-only" role="alert"  aria-live="assertive" aria-atomic="true"></div>

<div id="deck-wrapper">

  <!-- S0 TITLE (built by JS, but heading present for no-JS) -->
  <section class="slide s-title active" id="sl0" aria-roledescription="slide"></section>

  <!-- round + finale shells are generated by JS into #deck-wrapper -->

  <div id="nav">
    <button class="navbtn" id="prevb" type="button">← Back</button>
    <span id="pos" aria-hidden="true"></span>
    <div id="dots" aria-hidden="true"></div>
    <button class="navbtn" id="nextb" type="button">Next →</button>
  </div>
</div>

<script>
/* ============================================================================
   EDIT BELOW — this DECK object is the only thing you change per program.
   ============================================================================ */
const DECK = {
  /* Unique per embed. Namespaces every id + the localStorage save key. Kebab-case. */
  deckId: 'pfnyc-relevance',

  /* ---- title slide ---- */
  emoji: '🎯',
  title: 'Decide If a Company Fits the Challenge',
  intro: "You've met the three ETL challenges. Time to use them. I'll describe four real-style "
       + "companies — you read each one, then pick the challenge it fits (or call it not "
       + "relevant). After each pick we take the call apart to find the one move that makes it "
       + "a <b style=\"color:var(--on-highlight)\">judgment</b> instead of a guess. Two of them are traps.",
  startLabel: 'Start with Company 1 →',

  /* shown after a wrong match pick (retry) — never names the answer */
  retryText: 'Take another look at the profile and the challenge questions, then pick again.',
  /* safety valve: after this many wrong tries the answer is revealed and Next unlocks */
  maxTries: 3,

  /* The word for the second-perspective persona (lowercase). Used in headings. */
  perspective: 'partner',

  /* ---- the challenge picker options (same four every round) ----
     key : matched against each round's `correct`
     label : shown on the option button */
  challengeOptions: [
    { key:'c1',   label:'Challenge 1 · Planning, Data & Field Operations',
      q:'How can DEP make planning, cost estimation, field data, and admin review faster and more data-driven?' },
    { key:'c2',   label:'Challenge 2 · Asset Condition & Failure Prevention',
      q:'How can DEP catch problems in its pipes and equipment earlier — before failures, breaks, or downtime?' },
    { key:'c3',   label:'Challenge 3 · Resource & Energy Recovery',
      q:'How can DEP capture usable energy, heat, and materials from its wastewater and sewers?' },
    { key:'none', label:'Not relevant',
      q:"Doesn't map to any of the three challenges' use cases." },
  ],

  /* ---- THE THREE STEPS OF THE FIT CHECK (5-color palette; the name + icon +
     definition carry the difference, not color) ---- */
  parts: [
    { key:'does',    name:'What it does', color:'--on-highlight', def:"The company's actual activity — the verb and the thing it acts on.", icon:'eye'    },
    { key:'usecase', name:'Use case',     color:'--on-highlight', def:"The specific DEP use case it maps to. Name it, or the match doesn't count.", icon:'target' },
    { key:'verdict', name:'Verdict',      color:'--on-highlight', def:'In scope (High / Medium / Low) or Not relevant — the keep-or-cut call.', icon:'shield' },
  ],

  /* ---- ONE ROUND PER EXAMPLE ----
     company     : the company's name
     answerLabel : the decoded answer shown on the parts slide + in announcements
     correct     : which challengeOptions key is right ('c1'|'c2'|'c3'|'none')
     matchTitle  : the question above the picker
     blurb       : the 2-3 sentence company description
     matchFeedback : shown after any pick; names the correct answer + why
     headline/sub: heading + subhead on the parts slide
     map         : { partKey: "how THIS company expresses that part" }
     stake       : one line summarising what's at risk this round (escalates each round)
     prompt      : the partner question (may include <b>…</b>)
     hint        : sub-instruction under the prompt
     options     : { partKey: { fb:"feedback text", key:true|false } } for the parts picker */
  rounds: [
    {
      company:'HydroSense',
      answerLabel:'Challenge 2 · HydroSense',
      correct:'c2',
      matchTitle:'Which challenge does HydroSense fit?',
      blurb:"HydroSense works with a water utility's maintenance records — years of work orders and customer complaints. "
           +"It digs through that history to predict which parts of the system are most likely to fail next, right down to "
           +"which water mains will break. The product is an early-warning tool that flags trouble before a pipe bursts.",
      matchFeedback:"HydroSense maps to Challenge 2's pipe & main integrity use case. Predicting breaks before they happen is a clean, High fit.",
      headline:'HydroSense, decoded',
      sub:'Break it down: what it does → which use case → verdict.',
      map:{
        does:'Predicts water-main breaks from work-order and complaint history.',
        usecase:'Challenge 2 — pipe / main integrity.',
        verdict:'In scope. A clean, High fit — catching failure before it happens.'
      },
      stake:'STAKES: an easy keep. Miss this one and you are not reading the profiles.',
      prompt:"Now you're the partner at the desk screen — 8 seconds a company, 70 of 100 cut. Which step actually decides keep-or-cut?",
      hint:'Pick the step you would screen on, then click the rest. Each shows what it does — and does not — settle.',
      options:{
        does:{fb:"Knowing what it does is the start — but 'predicts breaks' only counts once you tie it to a specific use case.",key:false},
        usecase:{fb:"This is the call. 'Pipe/main integrity' is a Challenge 2 use case — point to it and the keep is automatic.",key:true},
        verdict:{fb:"'In scope' is the output, not the reason. Without the use case behind it, it is just a vibe.",key:false}
      }
    },
    {
      company:'StruviCorp',
      answerLabel:'Challenge 3 · StruviCorp',
      correct:'c3',
      matchTitle:"The least 'sensor-on-a-pipe' company in the set. Where does StruviCorp fit?",
      blurb:"StruviCorp doesn't monitor equipment or catch failures. It works at the tail end of a treatment plant, on the "
           +"wastewater itself, pulling valuable material back out of the flow instead of letting it wash away. Specifically, "
           +"it recovers struvite — a fertilizer — and other reusable nutrients from the waste stream.",
      matchFeedback:"StruviCorp maps to Challenge 3's Recovery & Conversion use case. Recovering nutrients from wastewater is in scope, however novel it sounds.",
      headline:'StruviCorp, decoded',
      sub:'No sensors here. The breakdown still fits — watch.',
      map:{
        does:"Recovers struvite fertilizer and nutrients from a plant's wastewater.",
        usecase:'Challenge 3 — Recovery & Conversion.',
        verdict:'In scope. The newest, least-crowded challenge — a find your peers may miss.'
      },
      stake:'STAKES: a hidden gem. Screen for the word "sensor" and you would wrongly cut the whole recovery category.',
      prompt:"Partner's desk again. This one has no sensor, no alarm. Which step keeps you from tossing it?",
      hint:'Pick your screen step, then explore the rest.',
      options:{
        does:{fb:"'Recovers nutrients from wastewater' sounds odd for a water utility — until you map it to a use case.",key:false},
        usecase:{fb:"Nailed it. 'Recovery & Conversion' is a Challenge 3 use case. Matched = in, no matter how novel it sounds.",key:true},
        verdict:{fb:"'In scope' — but only because you can point to the recovery use case. Drop it and this reads as random green-tech.",key:false}
      }
    },
    {
      company:'GridGuard OT',
      answerLabel:'Challenge 1 · GridGuard OT',
      correct:'c1',
      matchTitle:'Careful — the obvious read is the wrong one. Where does GridGuard fit?',
      blurb:"GridGuard is a cybersecurity company — but hold your instinct. It doesn't protect laptops, email, or office "
           +"networks; it protects the control systems that physically run water-treatment pumps and valves. Those are "
           +"OT/SCADA systems — the operational-technology controls that run the plant's machinery itself.",
      matchFeedback:"GridGuard maps to Challenge 1's OT/SCADA cybersecurity use case. It's a High fit; the use case beats the 'cyber, pass' gut call.",
      headline:'GridGuard OT, decoded',
      sub:"'Cybersecurity' almost got it cut. The use case saves it.",
      map:{
        does:'Protects the OT/SCADA systems running water-treatment pumps and valves.',
        usecase:'Challenge 1 — Cybersecurity (OT/SCADA).',
        verdict:"In scope — a High fit. Not an exclude, despite the word 'cybersecurity.'"
      },
      stake:'STAKES: a High fit you would cut by reflex. This is the miss the pros warn about.',
      prompt:"Partner's desk. Your gut says 'cyber — pass.' Which step overrides the gut?",
      hint:'Pick the step that flips your call, then read the rest.',
      options:{
        does:{fb:"'Protects water-plant control systems' is the tell — but only if you translate it into a use case.",key:false},
        usecase:{fb:"Exactly. 'OT/SCADA cyber' is a Challenge 1 use case and a High fit. The use case beats the gut every time.",key:true},
        verdict:{fb:"'In, High' — but the reason is the OT/SCADA use case. Without it, 'cybersecurity' reads as an auto-cut.",key:false}
      }
    },
    {
      company:'LockDesk IT',
      answerLabel:'Not relevant · LockDesk IT',
      correct:'none',
      matchTitle:'Same word as GridGuard, opposite answer. Where does LockDesk fit — or is it out?',
      blurb:"LockDesk is another cybersecurity company, so read it carefully. This one protects corporate office networks — "
           +"employee laptops, email inboxes, the back office. Nothing it touches runs a pump, a valve, or any part of the "
           +"water system.",
      matchFeedback:"LockDesk is Not relevant — IT-only cyber, with no DEP use case to point to. Same word as GridGuard, opposite verdict, because the use case is different.",
      headline:'LockDesk IT, decoded',
      sub:'The twin of GridGuard. Same word, opposite verdict — because the use case is different.',
      map:{
        does:'Protects office IT — laptops, email, corporate networks.',
        usecase:'None. No critical-infrastructure or OT tie to any DEP use case.',
        verdict:'Not relevant. IT-only cyber — the mirror image of GridGuard.'
      },
      stake:'STAKES: an afternoon wasted. Tag it "in" on the word "cyber" and you chase a dud.',
      prompt:"Last one. GridGuard was in; this is out. Which step told you the difference?",
      hint:'Pick the deciding step, then read why the twin flips.',
      options:{
        does:{fb:"'Protects office laptops' is the clue — it never touches the plant. But you confirm that by hunting for a use case.",key:false},
        usecase:{fb:"That's the whole lesson. You searched for a matching DEP use case and found none — so it's out. GridGuard had one; this doesn't.",key:true},
        verdict:{fb:"'Out' is right, but 'it's cyber so it's out' is the wrong reason — that logic would have cut GridGuard too. The use case is the reason.",key:false}
      }
    }
  ],

  /* Short label per round for the escalating "stakes" chips on the title + partner slides. */
  stakeChips:['Warm Up','miss a hidden gem','cut a High fit by reflex','chase an out-of-scope dud'],

  /* ---- finale ---- */
  finale:{
    heading:'You can match a company to a challenge on sight now.',
    body:"Every company you decoded came down to the same three-step read: <b>what it does</b>, "
       + "the <b>use case</b> it maps to, and the <b>verdict</b> (keep or cut). One step does "
       + "the real work: naming the <b>use case</b>. A match without a use case is a guess — "
       + "and guesses are how scouts miss OT/SCADA vendors and waste afternoons on office IT. "
       + "GridGuard and LockDesk proved it: <b>same word, opposite verdicts, because the use "
       + "case was different.</b>",
    bridge:"You now know what counts as <b>relevant</b> — and what counts as <b>qualified</b>.<br>Next: make it personal — learn how the Lane menu works and stake your claim on the patch of the field that's yours to scout."
  }
};

   Icons are DECORATIVE (part name sits beside them) → rendered aria-hidden.
   `__COLOR__` is replaced with the part's resolved color at build time.
   ============================================================================ */
const ICONS = {
  eye:`<svg viewBox="0 0 64 64" fill="none" stroke="__COLOR__" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">

    <path d="M50 12 q 5 4 0 8" opacity=".8"/><path d="M56 8 q 8 6 0 12" opacity=".5"/></svg>`,
  shield:`<svg viewBox="0 0 64 64" fill="none" stroke="__COLOR__" stroke-width="3" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <path d="M32 6 54 14v18c0 14-10 22-22 26C20 54 10 46 10 32V14z"/><polyline points="24,32 30,38 42,26" stroke-linecap="round"/></svg>`,
  chart:`<svg viewBox="0 0 64 64" fill="none" stroke="__COLOR__" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <path d="M10 10v44h44"/><rect x="20" y="34" width="7" height="14" fill="__COLOR__" stroke="none"/><rect x="33" y="24" width="7" height="24" fill="__COLOR__" stroke="none"/><rect x="46" y="14" width="7" height="34" fill="__COLOR__" stroke="none"/></svg>`,
  target:`<svg viewBox="0 0 64 64" fill="none" stroke="__COLOR__" stroke-width="3" aria-hidden="true" focusable="false">
    <circle cx="32" cy="32" r="24"/><circle cx="32" cy="32" r="14"/><circle cx="32" cy="32" r="4" fill="__COLOR__" stroke="none"/></svg>`
};

/* ============================================================================
   ================= DO NOT EDIT BELOW — generic engine =======================
   ============================================================================ */
(function(){
  'use strict';
  const NS = DECK.deckId;                       // namespace for every id
  const id = s => NS + '-' + s;                 // build a namespaced id
  const R  = DECK.rounds;
  const RN = R.length;
  const N  = 2 + RN * 3;                        // total slides: title + 3/round + finale
  const FIN = N - 1;
  const P  = DECK.parts;
  const ORDER = P.map(p => p.key);
  const META = Object.fromEntries(P.map(p => [p.key, p]));
  const colorOf = k => `var(${META[k].color})`;
  const CH = DECK.challengeOptions;
  const CHLABEL = Object.fromEntries(CH.map(o => [o.key, o.label]));

  /* decorative text-feedback glyphs — navy, aria-hidden (the word carries the meaning) */
  const CHECK_SVG = '<svg class="fbic" viewBox="0 0 24 24" fill="none" stroke="var(--on-highlight)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="20 6 9 17 4 12"/></svg>';
  const CROSS_SVG = '<svg class="fbic" viewBox="0 0 24 24" fill="none" stroke="var(--on-highlight)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';

  const wrapper = document.getElementById('deck-wrapper');
  const nav = document.getElementById('nav');
  const polite = document.getElementById('lr-polite');
  const alertRegion = document.getElementById('lr-alert');
  const isStacked = () => window.matchMedia('(max-width:640px)').matches;

  document.title = DECK.title + ' — Interactive';

  /* ---- announcements (textContent only; never re-create the node) ---- */
  let annT;
  function announce(msg, assertive){
    const region = assertive ? alertRegion : polite;
    clearTimeout(annT);
    region.textContent = '';                                    // clear this tick
    annT = setTimeout(() => { region.textContent = msg; }, 60); // set next tick — re-fires even when the text is identical (repeat "Not quite")
  }

  function iconFor(k){
    const p = META[k];
    if (p.svg) return p.svg;
    const tpl = ICONS[p.icon] || ICONS.target;
    return tpl.replaceAll('__COLOR__', colorOf(k));
  }
  function nameHTML(k){
    const p = META[k];
    return p.name + (p.alt ? ' <span style="color:var(--body);font-weight:400;font-size:.75rem">'+p.alt+'</span>' : '');
  }
  const esc = s => String(s);   // DECK copy is trusted author content (allows inline <b>)

  /* ---- per-round state ---- */
  const chosen   = R.map(() => null);  // match-phase last pick (challenge key), null until picked
  const solved   = R.map(() => false); // match-phase solved via a correct pick
  const attempts = R.map(() => 0);     // wrong-attempt count per round (drives the safety valve)
  const revealed = R.map(() => false); // answer revealed by the valve after MAXTRY wrong tries
  const picked   = R.map(() => null);  // partner-phase pick (part key)
  const MAXTRY   = DECK.maxTries || 3;
  let cur = 0;
  let lastResultAt = 0;               // timestamp of the last pick-result announce (race guard)
  // Next unlocks once a round is solved (correct pick) OR the answer has been revealed by the valve.

  /* ---- optional progress persistence (safe if storage is blocked) ---- */
  const SKEY = 'concept-decoder:' + NS;
  function save(){
    try{ localStorage.setItem(SKEY, JSON.stringify({chosen,picked,cur,attempts,revealed})); }catch(e){}
  }
  function load(){
    try{
      const s = JSON.parse(localStorage.getItem(SKEY) || 'null');
      if(!s || !Array.isArray(s.chosen) || s.chosen.length !== RN) return;
      s.chosen.forEach((v,i)=>{ chosen[i]=v; if(v!==null && v===R[i].correct) solved[i]=true; });
      s.picked.forEach((v,i)=>picked[i]=v);
      if(Array.isArray(s.attempts)) s.attempts.forEach((v,i)=>attempts[i]=v|0);
      if(Array.isArray(s.revealed)) s.revealed.forEach((v,i)=>revealed[i]=!!v);
      cur = Math.min(Math.max(0, s.cur|0), N-1);
    }catch(e){}
  }

  /* ---- slide index helpers ---- */
  const guessIdx = r => 1 + r*3;      // the "match the challenge" slide
  const partsIdx = r => 2 + r*3;
  const lensIdx  = r => 3 + r*3;
  const roundOfGuess = i => (i-1)%3===0 ? (i-1)/3 : -1;
  const roundOfLens  = i => (i-3)%3===0 && i<=lensIdx(RN-1) ? (i-3)/3 : -1;

  /* ---- build shells ---- */
  function buildShells(){
    // title
    const t = document.getElementById('sl0');
    t.setAttribute('role','group');
    t.setAttribute('aria-roledescription','slide');
    t.setAttribute('aria-label','1 of '+N);
    const chips = DECK.stakeChips.map((c,i)=>
      `<li class="stake-li"><span class="stake" id="${id('st'+i)}">Round ${i+1} · ${esc(c)}</span>`+
      (i<DECK.stakeChips.length-1?'<span class="arrow" aria-hidden="true">▸</span>':'')+`</li>`
    ).join('');
    t.innerHTML = `
      <h1 id="${id('h-0')}" tabindex="-1"><span class="emoji" aria-hidden="true">${esc(DECK.emoji)}</span> ${esc(DECK.title)}</h1>
      <p class="muted" style="font-size:1rem;max-width:660px;line-height:1.55">${esc(DECK.intro)}</p>
      <ul class="stakes" aria-label="What's at stake, round by round">${chips}</ul>
      <div><button class="btn" id="${id('start')}" type="button">${esc(DECK.startLabel||'Start →')}</button></div>`;
    t.querySelector('#'+id('start')).addEventListener('click', ()=>go(1));

    // rounds
    for(let r=0;r<RN;r++){
      wrapper.insertBefore(shell(guessIdx(r), buildMatch(r)), nav);
      wrapper.insertBefore(shell(partsIdx(r), buildParts(r)), nav);
      wrapper.insertBefore(shell(lensIdx(r),  buildLens(r)),  nav);
    }
    // finale
    const f = shell(FIN, `
      <h2 id="${id('h-'+FIN)}" tabindex="-1">${esc(DECK.finale.heading)}</h2>
      <p>${esc(DECK.finale.body)}</p>
      <div class="bridge">${esc(DECK.finale.bridge)}</div>`);
    f.classList.add('s-fin');
    wrapper.insertBefore(f, nav);
  }
  function shell(i, html){
    const s = document.createElement('section');
    s.className = 'slide';
    s.id = 'sl'+i;
    s.setAttribute('role','group');
    s.setAttribute('aria-roledescription','slide');
    s.setAttribute('aria-label',(i+1)+' of '+N);
    s.hidden = true;
    s.innerHTML = html;
    return s;
  }

  /* ---- MATCH slide: read the profile, pick the challenge (radiogroup) ---- */
  function buildMatch(r){
    const d = R[r];
    const opts = CH.map(o=>`
      <button class="m-opt" role="radio" aria-checked="false" id="${id('mo'+r+'-'+o.key)}"
              data-k="${o.key}" tabindex="-1">
        <span class="m-opttext"><span class="m-optlab">${esc(o.label)}</span>${o.q?`<span class="m-optq">${esc(o.q)}</span>`:''}</span><span class="chk" aria-hidden="true">✓ picked</span></button>`).join('');
    return `
      <div class="roundtag">Round ${r+1} of ${RN} · match the challenge</div>
      <h2 id="${id('h-'+guessIdx(r))}" tabindex="-1" class="qtitle">${esc(d.matchTitle)}</h2>
      <p class="blurb" id="${id('bl'+r)}">${esc(d.blurb)}</p>
      <div class="m-opts" role="radiogroup" id="${id('mg'+r)}"
           aria-labelledby="${id('h-'+guessIdx(r))}" aria-describedby="${id('bl'+r)} ${id('mfb'+r)}">${opts}</div>
      <div class="m-fb" id="${id('mfb'+r)}"></div>`;
  }

  function buildParts(r){
    const d = R[r];
    const cards = ORDER.map(k=>`
      <li class="part">
        <div class="pic">${iconFor(k)}</div>
        <div class="pname" style="color:${colorOf(k)}">${nameHTML(k)}</div>
        <div class="pdef">${esc(META[k].def)}</div>
        <div class="pmap">In this company: <b>${esc(d.map[k])}</b></div>
      </li>`).join('');
    return `
      <div class="parts-head">
        <div class="roundtag">Round ${r+1} of ${RN} · ${esc(d.answerLabel)}</div>
        <h2 id="${id('h-'+partsIdx(r))}" tabindex="-1" style="margin-top:9px">${esc(d.headline)}</h2>
        <div class="sub">${esc(d.sub)}</div>
      </div>
      <ul class="parts-grid" aria-label="The steps, mapped to this company">${cards}</ul>`;
  }

  function buildLens(r){
    const d = R[r];
    const chips = DECK.stakeChips.map((c,i)=>
      `<span class="stake ${i<=r?('on'+(i%4)):''}" >${esc(c)}</span>`+
      (i<DECK.stakeChips.length-1?'<span class="arrow" aria-hidden="true">▸</span>':'')
    ).join('');
    const opts = ORDER.map(k=>`
      <button class="a-opt" role="radio" aria-checked="false" id="${id('ao'+r+'-'+k)}"
              data-k="${k}" tabindex="-1">
        <span class="ic">${iconFor(k)}</span>${esc(META[k].name)}<span class="chk" aria-hidden="true">✓ picked</span></button>`).join('');
    return `
      <div class="a-esc" aria-hidden="true">${chips}</div>
      <div class="roundtag">Round ${r+1} of ${RN} · ${esc(DECK.perspective)}'s turn</div>
      <h2 id="${id('h-'+lensIdx(r))}" tabindex="-1" class="a-prompt" style="margin-top:9px">${esc(d.prompt)}</h2>
      <p class="a-hint" id="${id('ah'+r)}">${esc(d.hint)}</p>
      <div class="a-opts" role="radiogroup" id="${id('rg'+r)}" aria-labelledby="${id('h-'+lensIdx(r))}">${opts}</div>
      <div class="a-fb" id="${id('afb'+r)}"></div>`;
  }

  /* ---- MATCH mechanics (radiogroup; commit on Space/Enter/click) ---- */
  function renderMatchState(r, k, silent){
    chosen[r] = k;
    const correct = (k === R[r].correct);
    // count a genuine wrong attempt (live picks only), then trip the safety valve at the cap
    if(!silent && !correct && !solved[r] && !revealed[r]){
      attempts[r]++;
      if(attempts[r] >= MAXTRY) revealed[r] = true;
    }
    if(correct) solved[r] = true;
    const answered = solved[r] || revealed[r];
    const showKey = revealed[r] ? R[r].correct : k;   // once the valve trips, surface the CORRECT option
    const grp = document.getElementById(id('mg'+r));
    grp.querySelectorAll('.m-opt').forEach(b=>{
      const on = b.dataset.k === showKey;
      b.setAttribute('aria-checked', on ? 'true':'false');
      b.tabIndex = on ? 0 : -1;
      const chk = b.querySelector('.chk');
      // a valve-revealed option is the answer key, not the user's pick — label it honestly
      if(chk) chk.textContent = (on && revealed[r]) ? '✓ answer' : '✓ picked';
    });
    if(answered) grp.setAttribute('aria-readonly','true');   // lock but keep focusable/surveyable
    else grp.removeAttribute('aria-readonly');

    const fb = document.getElementById(id('mfb'+r));
    fb.className = 'm-fb show';
    if(correct){
      fb.innerHTML = '<span class="verdict">'+CHECK_SVG+'<b>Correct.</b></span> ' + esc(R[r].matchFeedback);
      if(!silent){ lastResultAt = Date.now(); announce('Correct. ' + R[r].matchFeedback + ' Next is now available.'); }
    } else if(revealed[r]){
      // safety valve: after MAXTRY misses, reveal the answer and unlock Next so no one is stuck
      fb.innerHTML = '<span class="verdict">'+CHECK_SVG+'<b>Here’s the answer.</b></span> ' + esc(R[r].matchFeedback);
      if(!silent){
        lastResultAt = Date.now();
        announce('That’s ' + MAXTRY + ' tries. Here’s the answer. ' + R[r].matchFeedback + ' Next is now available.');
        // align focus with the now-checked correct option (the roving stop moved there)
        const co = grp.querySelector('.m-opt[data-k="'+R[r].correct+'"]'); if(co) co.focus();
      }
    } else {
      const tries = '(Try ' + attempts[r] + ' of ' + MAXTRY + '. The answer unlocks after ' + MAXTRY + ' tries.) ';
      fb.innerHTML = '<span class="verdict">'+CROSS_SVG+'<b>Not quite.</b></span> ' + esc(tries + DECK.retryText);
      if(!silent){ lastResultAt = Date.now(); announce('Not quite. ' + tries + DECK.retryText); }
    }
    save(); updateNav();
  }
  function commitMatch(r, k){
    if(solved[r] || revealed[r]){ announce('This company is already answered — select Next to continue.'); return; }  // locked after a correct pick or the reveal
    if(k === chosen[r]) return;   // re-committing the same wrong option — nothing new to report
    renderMatchState(r, k, false);
  }
  function setupGuessRadiogroup(r){
    const grp = document.getElementById(id('mg'+r));
    if(!grp) return;
    const opts = [...grp.querySelectorAll('.m-opt')];
    // restore persisted answer silently, else set the initial single tab stop
    if(chosen[r] !== null) renderMatchState(r, chosen[r], true);
    else opts[0].tabIndex = 0;
    if(grp.dataset.wired) return;    // wire listeners once
    grp.dataset.wired = '1';
    grp.addEventListener('click', e=>{
      const b = e.target.closest('.m-opt'); if(b) commitMatch(r, b.dataset.k);
    });
    grp.addEventListener('keydown', e=>{
      const i = opts.indexOf(document.activeElement);
      if(i<0) return;
      let n = -1;
      if(e.key==='ArrowRight'||e.key==='ArrowDown') n = (i+1)%opts.length;
      else if(e.key==='ArrowLeft'||e.key==='ArrowUp') n = (i-1+opts.length)%opts.length;
      else if(e.key==='Home') n = 0;
      else if(e.key==='End')  n = opts.length-1;
      else if(e.key===' '||e.key==='Enter'){ e.preventDefault(); commitMatch(r, opts[i].dataset.k); return; }
      // arrows move focus ONLY (never commit) so a keyboard user can survey options without spoiling the answer
      if(n>=0){
        e.preventDefault();
        if(!solved[r] && !revealed[r]) opts.forEach((o,j)=>o.tabIndex = (j===n?0:-1));   // roving stays live until answered (retry allowed)
        opts[n].focus();
      }
    });
  }

  /* ---- partner (parts radiogroup) mechanics ---- */
  function pickLens(r, k, silent){
    picked[r] = k;
    const grp = document.getElementById(id('rg'+r));
    grp.querySelectorAll('.a-opt').forEach(b=>{
      const on = b.dataset.k === k;
      b.setAttribute('aria-checked', on ? 'true':'false');
      b.tabIndex = on ? 0 : -1;
    });
    const o = R[r].options[k];
    const fb = document.getElementById(id('afb'+r));
    fb.className = 'a-fb show';
    fb.innerHTML =
      '<span class="verdict '+(o.key?'key':'nokey')+'"><b>'+(o.key?'Sharp target.':'Fair pick.')+'</b></span> '
      + esc(o.fb) + '<div class="stakeline">' + esc(R[r].stake) + '</div>';
    if(!silent){ lastResultAt = Date.now(); announce((o.key?'Sharp target. ':'Fair pick. ') + o.fb + ' ' + R[r].stake); }
    save(); updateNav();
  }
  function setupRadiogroup(r){
    const grp = document.getElementById(id('rg'+r));
    if(!grp) return;
    const opts = [...grp.querySelectorAll('.a-opt')];
    if(picked[r]) pickLens(r, picked[r], true);   // restore silently
    else opts[0].tabIndex = 0;                     // first is the tab stop until a pick is made
    if(grp.dataset.wired) return;
    grp.dataset.wired = '1';
    grp.addEventListener('click', e=>{
      const b = e.target.closest('.a-opt'); if(b) pickLens(r, b.dataset.k);
    });
    grp.addEventListener('keydown', e=>{
      const i = opts.indexOf(document.activeElement);
      if(i<0) return;
      let n = -1;
      if(e.key==='ArrowRight'||e.key==='ArrowDown') n = (i+1)%opts.length;
      else if(e.key==='ArrowLeft'||e.key==='ArrowUp') n = (i-1+opts.length)%opts.length;
      else if(e.key==='Home') n = 0;
      else if(e.key==='End')  n = opts.length-1;
      else if(e.key===' '||e.key==='Enter'){ e.preventDefault(); pickLens(r, opts[i].dataset.k); return; }
      if(n>=0){ e.preventDefault(); opts[n].focus(); pickLens(r, opts[n].dataset.k); }  // neutral picks: selection follows focus
    });
  }

  /* ---- gating ---- */
  function canLeave(i){
    const rg = roundOfGuess(i); if(rg>=0) return solved[rg] || revealed[rg];
    const rl = roundOfLens(i);  if(rl>=0) return picked[rl]!==null;
    return true;
  }
  function gateReason(i){
    if(roundOfGuess(i)>=0) return 'Match this company to a challenge to continue.';
    if(roundOfLens(i)>=0)  return 'Make your pick to continue.';
    return '';
  }

  /* ---- deck navigation ---- */
  const dots = document.getElementById('dots');
  for(let i=0;i<N;i++){ const d=document.createElement('div'); d.className='dt'; dots.appendChild(d); }

  function showSlide(i){
    document.querySelectorAll('#deck-wrapper .slide').forEach(s=>{
      const on = s.id === 'sl'+i;
      s.classList.toggle('active', on);
      s.hidden = !on;
    });
  }
  function setupFor(i){
    if(roundOfGuess(i)>=0) setupGuessRadiogroup(roundOfGuess(i));
    if(roundOfLens(i)>=0)  setupRadiogroup(roundOfLens(i));
  }
  function focusHeading(i){
    const h = document.getElementById(id('h-'+i));
    if(h){ h.focus({preventScroll:true}); }
    // position is not conveyed by focusing the heading — announce it separately, but don't
    // clobber a pick result the user just triggered before advancing (the focused heading
    // already orients them on the new slide).
    setTimeout(()=>{ if(Date.now() - lastResultAt > 1400) announce('Slide ' + (i+1) + ' of ' + N); }, 350);
  }
  function go(n){
    if(isStacked()) return;                     // stacked mode: native scrolling, no deck nav
    if(n<0 || n>=N) return;
    if(n>cur && !canLeave(cur)){ announce(gateReason(cur)); return; }
    cur = n;
    showSlide(cur);
    setupFor(cur);
    updateNav();
    focusHeading(cur);
    save();
  }
  function updateNav(){
    [...dots.children].forEach((d,i)=>d.classList.toggle('on', i===cur));
    document.getElementById('pos').textContent = 'Slide ' + (cur+1) + ' of ' + N;
    const prev = document.getElementById('prevb');
    prev.setAttribute('aria-disabled', cur===0 ? 'true':'false');
    const nb = document.getElementById('nextb');
    const locked = !canLeave(cur);
    const atEnd = cur===N-1;
    nb.setAttribute('aria-disabled', (atEnd||locked) ? 'true':'false');
    if(locked){ nb.setAttribute('aria-describedby', id('gatereason')); ensureGateReason(); document.getElementById(id('gatereason')).textContent = gateReason(cur); }
    else nb.removeAttribute('aria-describedby');
    nb.classList.toggle('ready', !atEnd && !locked && (roundOfGuess(cur)>=0 || roundOfLens(cur)>=0));
  }
  function ensureGateReason(){
    if(document.getElementById(id('gatereason'))) return;
    const s = document.createElement('span');
    s.id = id('gatereason'); s.className='sr-only';
    document.body.appendChild(s);
  }

  /* ---- wire nav buttons ---- */
  document.getElementById('prevb').addEventListener('click', ()=>go(cur-1));
  document.getElementById('nextb').addEventListener('click', ()=>go(cur+1));

  /* ---- keyboard: arrows advance, but never hijack typing or bypass the gate ---- */
  window.addEventListener('keydown', e=>{
    if(isStacked()) return;
    const t = e.target;
    if(t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable)) return;
    if(t && t.closest && t.closest('[role="radiogroup"]')) return;   // radiogroups own their arrows
    if(e.altKey||e.ctrlKey||e.metaKey) return;
    if(e.key==='ArrowRight') go(cur+1);
    else if(e.key==='ArrowLeft') go(cur-1);
  });

  /* ---- scale-to-fit (desktop only; stacked mode is fully fluid via CSS) ---- */
  function scaleDeck(){
    if(isStacked()){ wrapper.style.transform='none'; return; }
    const s = Math.min(window.innerWidth/960, window.innerHeight/540, 1);
    const ox = Math.max(0,(window.innerWidth-960*s)/2), oy = Math.max(0,(window.innerHeight-540*s)/2);
    wrapper.style.transformOrigin='top left';
    wrapper.style.transform='translate('+ox+'px,'+oy+'px) scale('+s+')';
  }

  /* ---- when crossing the stacked/desktop boundary, reset slide visibility ---- */
  function syncMode(){
    if(isStacked()){
      // show everything, ungated, no active-only logic
      document.querySelectorAll('#deck-wrapper .slide').forEach(s=>{ s.hidden=false; s.classList.remove('active'); });
      for(let r=0;r<RN;r++){ setupGuessRadiogroup(r); setupRadiogroup(r); }
    }else{
      showSlide(cur);
      setupFor(cur);
      updateNav();
    }
    scaleDeck();
  }

  /* ---- boot ---- */
  buildShells();
  load();
  ensureGateReason();
  if(isStacked()){ syncMode(); }
  else{ showSlide(cur); setupFor(cur); updateNav(); scaleDeck(); }
  window.addEventListener('resize', syncMode);
  window.addEventListener('orientationchange', syncMode);
})();
</script>
