<!--
================================================================================
TRAINING INTERACTIVE: Meet the FC roles, then break the chain (2026-11-21)
================================================================================
Replaces the Google Sheet "FC Role Table" task on Amazon P1 Step 1, page 4
("Map the Workforce Structure at an AFC", working copy). The page is now a
[Training]: no submission. Learners keep their notes by downloading a PDF.

Slides: 4 role cards (illustrated persona + where they work + 1 quick check)
        → 2 "break the chain" scenarios → my notes + PDF → wrap-up.
Edit only the DECK object. Checks are practice: never graded, never gated.
Card facts come only from earlier P1 pages (order-flow video, Learning
Ambassador page, the old pre-filled role table). No new facts.

ACCESSIBILITY (WCAG 2.2 AA), same tokens and patterns as amazon-p1-fc-order-flow-check:
  - Inactive slides use `hidden`; Back/Next/dot navigation moves focus to the
    new slide's heading; a polite live region announces "Slide K of N".
  - Each check is a native <fieldset>/<legend> radio group + "Check answer".
    Feedback goes into an aria-live="polite" region that exists on load.
    Right/wrong is said in words and by icon shape, never by color alone.
    The scenario "ripple" is revealed after a correct answer; the feedback
    says to read it below. Retry always allowed.
  - Persona illustrations are inline SVG with role="img" + <title>.
  - "Where they work" strip says "this role" in text, not just by highlight.
  - Notes: visible <label>s, autosave to localStorage (try/catch). Saving
    is explained in static text; no announcement per keystroke.
  - PDF: jsPDF text PDF (selectable text, title + language set). If jsPDF is
    missing it falls back to the browser's print dialog with a print layout.
    "Open full screen" carries the notes in the URL hash, because embedded
    iframes may block downloads and use separate storage.
  - No arrow-key slide shortcuts (radio groups keep native arrow keys).
  - Text ≥ 4.5:1, UI borders ≥ 3:1, visible focus ring, 44px targets,
    prefers-reduced-motion respected, one column ≤ 640px.
================================================================================
-->
<title>Meet the FC Roles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>
/* ============================ EDIT THIS ============================ */
const DECK = {
  deckId: "amazon-p1-fc-roles-chain",
  title: "Meet the FC roles, then break the chain",
  flow: ["Receive", "Stow", "Pick", "Pack", "Ship"],
  roles: [
    {
      key: "stower", name: "Stower", step: "Stow", art: "stower",
      alt: "Illustration: a Stower in a safety vest holds a handheld scanner and places an item into a bin on a yellow storage pod.",
      does: "Puts received items into storage bins and scans each one, so the system knows where it is.",
      tools: "Handheld scanner, storage pods moved by robots",
      check: {
        question: "A Stower just filled a bin. Whose work depends on that bin next?",
        options: ["The Picker", "The Packer", "The Learning Ambassador"],
        answer: 0,
        why: "Pickers pull orders from the bins Stowers fill. If an item is scanned into the wrong bin, the Picker is the first to feel it."
      }
    },
    {
      key: "picker", name: "Picker", step: "Pick", art: "picker",
      alt: "Illustration: a Picker in a safety vest carries a blue tote of items, with a station screen and a conveyor beside them.",
      does: "Pulls the items for each customer order from storage.",
      tools: "Handheld scanner or station screen, totes, conveyor",
      check: {
        question: "A Picker's tote rolls down the conveyor. Who works with it next?",
        options: ["A Stower", "A Packer", "A Receive associate"],
        answer: 1,
        why: "Pickers get work from the Stowers' bins and hand it to the Packers. They sit in the middle of the chain, so a slowdown on either side reaches them."

    },
    {
      key: "packer", name: "Packer", step: "Pack", art: "packer",
      alt: "Illustration: a Packer in a safety vest tapes a cardboard box on a packing table next to a label printer.",
      does: "Packs each order in the right box and sends it on for shipping.",
      tools: "Packing station, scanner, label printer",
      check: {
        question: "Which roles does a Packer work most closely with?",
        options: [
          "Stowers and Receive associates",
          "Pickers, who send them totes, and the Ship step, which takes their labeled boxes",
          "Only other Packers"
        ],
        answer: 1,
        why: "Each role works most closely with the step before it and the step after it. A Packer can catch a wrong item, but can't fix the bin it came from."

    },
    {
      key: "la", name: "Learning Ambassador", step: null, art: "la",
      alt: "Illustration: a Learning Ambassador in a teal vest holds a clipboard and explains something to a new associate in an orange vest who holds a scanner.",
      does: "An experienced associate who trains, coaches and supports new associates, and spots skill gaps. A peer, not a manager. Often wears a different vest so new hires know who to ask.",

      check: {
        question: "Who does a Learning Ambassador work most closely with?",
        options: [
          "Only new Stowers",
          "New hires in every role on the floor",
          "Managers and HR, not associates"

        answer: 1,

  scenarios: [

      eyebrow: "Break the chain: scenario 1",
      title: "A new Stower quits in week 2",
      setup: "Their replacement starts Monday and is still learning. They're rushing, and some items get scanned into the wrong bins.",
      question: "Which role notices the problem first?",
      options: ["The Picker", "The Packer", "The customer"],
      answer: 0,
      ripple: [
        ["Stow", "Items land in the wrong bins. This is where it starts."],
        ["Pick", "The Picker can't find items where the system says they are. Picks slow down, or the wrong item gets picked."],
        ["Pack", "Totes arrive late or with the wrong item, so Packers wait or have to catch errors."],
        ["Ship", "Some orders leave late or wrong. Now the customer notices."],
        ["Learning Ambassador", "Spends hours training the replacement instead of coaching other new hires."]

    {
      eyebrow: "Break the chain: scenario 2",
      title: "Three new Packers leave in their first month",
      setup: "A Learning Ambassador is pulled off the floor to train their replacements.",
      question: "What else slows down?",
      options: [

        "Coaching for new hires at every other step, so mistakes rise across the floor",
        "Only the trucks at the Ship step"

      answer: 1,
      ripple: [
        ["Pack", "New Packers work slowly while they learn, and totes back up at the packing line."],
        ["Pick", "Pickers' totes pile up waiting for a free packing station."],
        ["Stow and Pick", "New hires in these roles get less help from the LA, so their mistakes go uncaught for longer."],
        ["Ship", "Fewer boxes are ready on time."],

      ]

  ],
  takeawayExample: [
    "Each role depends on the one before it, so a mistake at stow shows up later at pick and pack.",
    "When a new Stower leaves in their first weeks, a Learning Ambassador has to train a replacement, and errors rise until that person gets up to speed."
  ],
  takeaways: [

    "Learning Ambassadors connect to new hires in every role. Their time is shared across the whole floor.",
    "When a new hire leaves early, it isn't just one empty spot. The next role slows down, and a Learning Ambassador's time goes to retraining."
  ],
  nextUp: "Next, you'll learn how early employee exits slow down an FC and drive up costs.",
  pdfProgram: "Amazon Operational Strategy & People Analytics Externship · Project 1"
};

<style>
  :root {
    --eggshell: #F3EEDF;
    --paper: #FBF8F0;
    --white: #FFFFFF;
    --ink: #1D2420;
    --ink-soft: #55605A;   /* 6.5:1 on white, 5.6:1 on eggshell */
    --line: #E2DBC6;       /* decorative only */
    --edge: #7A7F76;       /* UI borders, 4.1:1 on white */
    --green: #2F6B45;      /* 6.3:1 on white */
    --green-dark: #1F4D31;
    --green-tint: #E3EEE5;
    --amber: #8A5E0F;      /* 5.6:1 on white */
    --amber-tint: #F6EEDC;
    --focus: #1F4D31;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    font-family: "Inter", system-ui, sans-serif;
    background: var(--eggshell); color: var(--ink);
    line-height: 1.5; padding: 16px; -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font-family: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  .deck { max-width: 880px; margin: 0 auto; }
  .deck-title { font-size: 15px; font-weight: 700; margin: 0 0 12px; }
  .slide { overflow-wrap: anywhere; background: var(--white); border: 1px solid var(--line); border-radius: 16px; padding: 28px 32px 24px; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--green); margin: 0; }
  .slide h2 { font-size: 22px; line-height: 1.25; margin: 4px 0 12px; }
  .slide h2:focus { outline: none; }
  .slide h2:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; border-radius: 4px; }
  .slide h3 { font-size: 17px; margin: 18px 0 8px; }
  .slide p { font-size: 16px; margin: 0 0 16px; }

  /* role card */
  .role { display: grid; grid-template-columns: 240px 1fr; gap: 22px; align-items: start; margin-bottom: 18px; }
  .art { width: 100%; height: auto; display: block; border-radius: 14px; background: var(--paper); border: 1px solid var(--line); }
  .facts { margin: 0; display: grid; gap: 10px; }
  .facts div { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  .facts dt { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
  .facts dd { margin: 2px 0 0; font-size: 16px; }
  .strip-label { font-size: 13px; font-weight: 600; color: var(--ink-soft); margin: 12px 0 6px; }
  .strip { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .strip li { font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-soft); background: var(--white); }
  .strip li.here { border: 2px solid var(--green); background: var(--green-tint); color: var(--green-dark); font-weight: 800; }
  .strip li.support { border: 2px dashed var(--green); color: var(--green-dark); font-weight: 600; }
  .check-box { border-top: 1px solid var(--line); padding-top: 18px; }

  /* quick check */
  fieldset { border: 0; margin: 0 0 14px; padding: 0; min-width: 0; }
  legend { font-size: 18px; font-weight: 700; line-height: 1.35; margin: 0 0 12px; padding: 0; }
  .opt { display: flex; gap: 12px; align-items: flex-start; min-height: 44px; padding: 10px 14px; margin-bottom: 8px;
    border: 2px solid var(--edge); border-radius: 10px; cursor: pointer; font-size: 16px; background: var(--white); }
  .opt:hover { border-color: var(--ink); }
  .opt input { width: 20px; height: 20px; margin: 2px 0 0; flex: none; accent-color: var(--green); }
  .opt:has(input:checked) { border-color: var(--green); background: var(--green-tint); }
  .opt:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
  .opt input:focus-visible { outline: none; }
  .btn { min-height: 44px; border: 2px solid var(--ink); background: var(--ink); color: var(--white);
    border-radius: 10px; padding: 8px 18px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .btn:hover { background: var(--green-dark); border-color: var(--green-dark); }
  .btn.ghost { background: var(--white); color: var(--ink); border-color: var(--edge); }
  .btn.ghost:hover { border-color: var(--ink); background: var(--paper); }
  .feedback { margin-top: 14px; }
  .fb { border-left: 4px solid; border-radius: 0 10px 10px 0; padding: 10px 14px; font-size: 15px; }
  .fb p { margin: 0; font-size: 15px; }
  .fb p + p { margin-top: 6px; }
  .fb .verdict { font-weight: 800; display: flex; gap: 8px; align-items: center; }
  .fb.ok { border-color: var(--green); background: var(--green-tint); }
  .fb.ok .verdict { color: var(--green-dark); }
  .fb.no { border-color: var(--amber); background: var(--amber-tint); }
  .fb.no .verdict { color: #6E4A0A; }

  /* scenario */
  .setup { background: var(--amber-tint); border-left: 4px solid var(--amber); border-radius: 0 10px 10px 0; padding: 12px 16px; }
  .ripple { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 8px; counter-reset: r; }
  .ripple li { counter-increment: r; display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: start;
    background: var(--paper); border: 1px solid var(--line); border-left: 4px solid var(--amber); border-radius: 10px; padding: 10px 14px; font-size: 15px; }
  .ripple li::before { content: counter(r); width: 28px; height: 28px; border-radius: 50%; background: var(--amber); color: var(--white);
    font-weight: 800; display: grid; place-items: center; font-size: 14px; }
  .ripple b { display: block; font-size: 15px; }

  /* notes */
  .field { margin-bottom: 14px; }
  .field label { display: block; font-weight: 700; font-size: 15px; margin-bottom: 4px; }
  .hint { display: block; font-size: 14px; color: var(--ink-soft); margin-bottom: 6px; }
  .field input, .field textarea { width: 100%; border: 2px solid var(--edge); border-radius: 10px; padding: 10px 12px; font-size: 16px; color: var(--ink); background: var(--white); }
  .field textarea { min-height: 72px; resize: vertical; }
  .field input:focus-visible, .field textarea:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; border-color: var(--green); }
  .role-notes { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  details.example { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; margin: 0 0 16px; }
  details.example summary { cursor: pointer; font-weight: 700; min-height: 32px; display: flex; align-items: center; gap: 8px; list-style: none; }
  details.example summary::-webkit-details-marker { display: none; }
  details.example summary::before { content: "▸"; font-size: 14px; }
  details.example[open] summary::before { content: "▾"; }
  details.example p { font-size: 15px; margin: 8px 0 0; }
  .save-note { font-size: 14px; color: var(--ink-soft); }
  .pdf-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 6px 0 10px; }
  .pdf-help { font-size: 14px; color: var(--ink-soft); margin: 0; }
  .pdf-help a { color: var(--green-dark); font-weight: 600; }

  /* takeaways */
  .takeaways { margin: 0 0 16px; padding-left: 24px; font-size: 16px; }
  .takeaways li { margin-bottom: 8px; }
  .finish { background: var(--green-tint); border-radius: 10px; padding: 12px 16px; font-weight: 600; margin: 0 0 12px; }
  .next-hint { border: 2px dashed var(--edge); border-radius: 10px; padding: 12px 16px; font-size: 15px; margin: 0; }

  /* nav */
  .slide-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; }
  .nav-btn { min-height: 44px; min-width: 44px; background: var(--white); border: 1px solid var(--edge); color: var(--ink);
    border-radius: 10px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .nav-btn.primary { background: var(--ink); color: var(--white); border-color: var(--ink); }
  .nav-btn.primary:hover:not(:disabled) { background: var(--green-dark); }
  .nav-btn:disabled { opacity: .45; cursor: default; }
  .dots { display: flex; gap: 2px; list-style: none; margin: 0; padding: 0; }
  .dot { width: 32px; height: 44px; border: 0; padding: 0; background: none; cursor: pointer; display: grid; place-items: center; }
  .dot::before { content: ""; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--ink-soft); background: var(--white); }
  .dot.seen::before { border-color: var(--green); background: var(--green); }
  .dot[aria-current="step"]::before { width: 26px; border-radius: 6px; border-color: var(--green); background: var(--green); }
  .counter { font-size: 13px; color: var(--ink-soft); text-align: center; margin-top: 6px; }

  #printout { display: none; }

  @media (max-width: 640px) {
    body { padding: 12px; }
    .slide { padding: 20px 18px; }
    .slide h2 { font-size: 20px; }
    .role { grid-template-columns: 1fr; gap: 14px; }
    .art { max-width: 320px; }
    .role-notes { grid-template-columns: 1fr; }
    .slide-nav { flex-wrap: wrap; }
    .dots { order: -1; width: 100%; justify-content: center; }
    .nav-btn { flex: 1; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .slide:not([hidden]) { animation: in .25s ease; }
    @keyframes in { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: none; } }
  }
  @media print {
    body { background: #fff; padding: 0; }
    .deck { display: none !important; }
    #printout { display: block; font-size: 12pt; color: #000; }
    #printout h1 { font-size: 18pt; margin: 0 0 4pt; }
    #printout h2 { font-size: 13pt; margin: 14pt 0 4pt; }
    #printout p, #printout li { margin: 0 0 4pt; }
  }
</style>
</head>
<body>
<main class="deck" aria-labelledby="deckTitle">

    <button type="button" class="nav-btn primary" id="nextBtn">Next<span aria-hidden="true"> →</span></button>

</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const R = DECK.roles, S = DECK.scenarios;
  const KEY = "fc-roles:" + DECK.deckId;
  const HASH = location.hash;
  $("deckTitle").textContent = DECK.title;

  /* ---------- persona illustrations (inline SVG) ---------- */
  const VEST = "#F2A93B", LA_VEST = "#2E8B7A";
  function person(o) {
    const { x, y, s = 1, skin, hair, vest = VEST, shirt = "#4F5D6B", pants = "#34404C", arms = [], hands = true, bun = false } = o;
    const arm = a => `<polyline points="${a}" fill="none" stroke="${shirt}" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>`;
    const hand = a => { const p = a.trim().split(/\s+/).pop().split(","); return `<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="${skin}"/>`; };
    return `<g transform="translate(${x} ${y}) scale(${s})">
      <ellipse cx="0" cy="2" rx="34" ry="5" fill="#000" opacity=".08"/>
      <rect x="-16" y="-50" width="13" height="50" rx="5" fill="${pants}"/>
      <rect x="3" y="-50" width="13" height="50" rx="5" fill="${pants}"/>

      <rect x="2" y="-6" width="17" height="7" rx="3" fill="#2A2A2A"/>
      <rect x="-27" y="-108" width="54" height="64" rx="18" fill="${shirt}"/>
      <rect x="-25" y="-104" width="50" height="58" rx="14" fill="${vest}"/>
      <polygon points="-9,-106 9,-106 0,-88" fill="${shirt}"/>
      <rect x="-25" y="-70" width="50" height="5" fill="#fff" opacity=".75"/>
      <rect x="-6" y="-116" width="12" height="12" fill="${skin}"/>
      ${bun ? `<circle cx="0" cy="-149" r="8" fill="${hair}"/>` : ""}
      <circle cx="0" cy="-128" r="17" fill="${skin}"/>
      <path d="M-18,-126 A18,18 0 0 1 18,-126 Q6,-136 -18,-126 Z" fill="${hair}"/>
      <circle cx="-6" cy="-128" r="1.9" fill="#1D2420"/><circle cx="6" cy="-128" r="1.9" fill="#1D2420"/>
      <path d="M-5,-120 Q0,-116 5,-120" fill="none" stroke="#1D2420" stroke-width="1.6" stroke-linecap="round"/>
      ${arms.map(arm).join("")}${hands ? arms.map(hand).join("") : ""}
    </g>`;
  }
  const bins = (x, y, w, h, cols, rows, fill, stroke) => {
    let g = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`;
    for (let c = 1; c < cols; c++) g += `<line x1="${x + c * w / cols}" y1="${y}" x2="${x + c * w / cols}" y2="${y + h}" stroke="${stroke}" stroke-width="2"/>`;
    for (let r = 1; r < rows; r++) g += `<line x1="${x}" y1="${y + r * h / rows}" x2="${x + w}" y2="${y + r * h / rows}" stroke="${stroke}" stroke-width="2"/>`;
    return g;
  };
  const SCENES = {
    stower: () => `
      ${bins(150, 26, 76, 140, 3, 5, "#F2C14E", "#B8892A")}
      <rect x="157" y="38" width="12" height="14" fill="#3D6FA8"/><rect x="208" y="66" width="12" height="16" fill="#C8955A"/>
      <rect x="183" y="122" width="14" height="12" fill="#7A9E7E"/><rect x="157" y="146" width="14" height="12" fill="#C8955A"/>
      ${person({ x: 86, y: 166, skin: "#8D5524", hair: "#1A1A1A", arms: ["22,-98 40,-110 56,-118", "-22,-98 -18,-76 2,-70"] })}
      <rect x="136" y="40" width="16" height="14" rx="2" fill="#C8955A" stroke="#9B6E3C" stroke-width="1.5"/>
      <rect x="84" y="88" width="16" height="9" rx="2" fill="#1D2420"/>
      <line x1="100" y1="92" x2="136" y2="52" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="3 3"/>`,
    picker: () => `
      <rect x="182" y="40" width="4" height="88" fill="#55605A"/>
      <rect x="164" y="30" width="44" height="32" rx="4" fill="#1D2420"/>
      <rect x="170" y="38" width="24" height="3" fill="#7ED6A0"/><rect x="170" y="45" width="32" height="3" fill="#7ED6A0"/><rect x="170" y="52" width="18" height="3" fill="#7ED6A0"/>
      <rect x="132" y="132" width="100" height="10" rx="3" fill="#55605A"/>
      ${[142, 162, 182, 202, 222].map(cx => `<circle cx="${cx}" cy="148" r="5" fill="#7A7F76"/>`).join("")}
      <rect x="196" y="110" width="30" height="22" rx="3" fill="#3D6FA8"/>
      ${person({ x: 84, y: 166, skin: "#F1C27D", hair: "#7A4A24", bun: true, hands: false, arms: ["-22,-98 -26,-76 -22,-70", "22,-98 26,-76 22,-70"] })}
      <rect x="54" y="92" width="18" height="12" fill="#C8955A"/><rect x="76" y="88" width="12" height="16" fill="#7A9E7E"/><rect x="92" y="94" width="14" height="10" fill="#F2C14E"/>
      <rect x="52" y="100" width="64" height="30" rx="4" fill="#3D6FA8"/>
      <rect x="52" y="100" width="64" height="6" rx="2" fill="#2F5A8C"/>
      <circle cx="56" cy="102" r="6" fill="#F1C27D"/><circle cx="112" cy="102" r="6" fill="#F1C27D"/>`,
    packer: () => `
      <rect x="112" y="112" width="122" height="9" rx="2" fill="#8A6A45"/>
      <rect x="120" y="121" width="6" height="45" fill="#8A6A45"/><rect x="222" y="121" width="6" height="45" fill="#8A6A45"/>
      <polygon points="140,78 196,78 206,66 150,66" fill="#D9A86C" stroke="#9B6E3C" stroke-width="1.5"/>
      <rect x="140" y="78" width="56" height="34" fill="#C8955A" stroke="#9B6E3C" stroke-width="1.5"/>
      <rect x="164" y="66" width="8" height="46" fill="#E8D3A8"/>
      <rect x="145" y="86" width="16" height="12" fill="#fff"/><rect x="147" y="89" width="11" height="1.6" fill="#55605A"/><rect x="147" y="93" width="8" height="1.6" fill="#55605A"/>
      <rect x="206" y="90" width="24" height="22" rx="3" fill="#3B4A5A"/><rect x="211" y="86" width="14" height="6" fill="#fff"/>
      ${person({ x: 84, y: 166, skin: "#C68642", hair: "#2B1B10", arms: ["22,-98 40,-86 60,-82", "-22,-98 -28,-74 -26,-56"] })}`,
    la: () => `
      <rect x="104" y="18" width="58" height="32" rx="10" fill="#fff" stroke="#7A7F76" stroke-width="1.5"/>
      <polygon points="120,49 128,49 116,60" fill="#fff" stroke="#7A7F76" stroke-width="1.5"/>
      <rect x="119" y="47" width="10" height="3" fill="#fff"/>
      <polyline points="118,34 128,42 146,26" fill="none" stroke="#2F6B45" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      ${person({ x: 72, y: 166, skin: "#E0AC69", hair: "#4A3122", vest: LA_VEST, arms: ["22,-98 40,-108 52,-122", "-22,-98 -22,-76 -6,-70"] })}
      <rect x="54" y="82" width="22" height="28" rx="2" fill="#C8955A"/><rect x="57" y="87" width="16" height="20" fill="#fff"/>
      <rect x="59" y="91" width="11" height="1.6" fill="#55605A"/><rect x="59" y="96" width="9" height="1.6" fill="#55605A"/><rect x="59" y="101" width="11" height="1.6" fill="#55605A"/>
      <circle cx="66" cy="96" r="6" fill="#E0AC69"/>
      ${person({ x: 186, y: 166, s: .86, skin: "#5C3A21", hair: "#1A1A1A", arms: ["-22,-98 -26,-74 -14,-64", "22,-98 26,-74 24,-56"] })}
      <rect x="160" y="108" width="14" height="8" rx="2" fill="#1D2420"/>`
  };
  const svg = r => `<svg class="art" viewBox="0 0 240 180" role="img" aria-labelledby="art-${r.key}">
      <title id="art-${r.key}">${esc(r.alt)}</title>
      <rect x="0" y="166" width="240" height="14" fill="#E2DBC6"/>${SCENES[r.art]()}</svg>`;

  /* ---------- slides ---------- */
  const labels = [
    ...R.map(r => `Meet the ${r.name}`),
    ...S.map((s, i) => `Break the chain ${i + 1} of ${S.length}`),
    "My notes", "What to remember"
  ];
  const total = labels.length;

  const checkForm = (id, c) => `
    <form data-id="${id}" novalidate>
      <fieldset>
        <legend>${esc(c.question)}</legend>
        ${c.options.map((o, j) => `<label class="opt"><input type="radio" name="${id}" value="${j}"><span>${esc(o)}</span></label>`).join("")}
      </fieldset>
      <button type="submit" class="btn">Check answer</button>
      <div class="feedback" id="fb-${id}" aria-live="polite"></div>
    </form>`;

  const roleSlide = (r, i) => {
    const strip = DECK.flow.map(f => {
      if (!r.step) return `<li class="support">${f}</li>`;
      return f === r.step ? `<li class="here">${f} <span>(this role)</span></li>` : `<li>${f}</li>`;
    }).join("");
    const stripLabel = r.step ? `Where a ${r.name} works in the order flow` : `A ${r.name} supports new hires at every step`;
    return `
      <p class="eyebrow">Role ${i + 1} of ${R.length}</p>
      <h2 tabindex="-1">The ${esc(r.name)}</h2>
      <div class="role">
        ${svg(r)}
        <div>
          <dl class="facts">
            <div><dt>What they do</dt><dd>${esc(r.does)}</dd></div>
            <div><dt>Tools</dt><dd>${esc(r.tools)}</dd></div>
          </dl>
          <p class="strip-label" id="strip-${r.key}">${stripLabel}</p>
          <ol class="strip" aria-labelledby="strip-${r.key}">${strip}</ol>
        </div>
      </div>
      <div class="check-box">
        <p class="eyebrow">Quick check · not graded</p>
        ${checkForm("r" + i, r.check)}
      </div>`;
  };

  const scenSlide = (s, i) => `
    <p class="eyebrow">${esc(s.eyebrow)}</p>
    <h2 tabindex="-1">${esc(s.title)}</h2>
    <p class="setup">${esc(s.setup)}</p>
    ${checkForm("s" + i, s)}
    <div id="ripple-s${i}" hidden>
      <h3>What happens down the chain</h3>
      <ol class="ripple">${s.ripple.map(([who, what]) => `<li><div><b>${esc(who)}</b>${esc(what)}</div></li>`).join("")}</ol>
    </div>`;

  const notesSlide = `
    <p class="eyebrow">My notes</p>
    <h2 tabindex="-1">Put it in your own words</h2>
    <p>These notes are just for you. Nothing is submitted. Download them as a PDF if you want to look back at them in later projects.</p>
    <h3 id="whyHead">What would break or slow down without each role? <span class="hint" style="display:inline">(optional)</span></h3>
    <div class="role-notes" role="group" aria-labelledby="whyHead">
      ${R.map(r => `<div class="field"><label for="n-${r.key}">${esc(r.name)}</label>
        <input type="text" id="n-${r.key}" data-note="${r.key}" autocomplete="off"></div>`).join("")}
    </div>
    <h3>Your 2-sentence takeaway</h3>
    <div class="field">
      <label for="n-t1">Sentence 1: How do the roles depend on each other?</label>
      <textarea id="n-t1" data-note="t1"></textarea>
    </div>
    <div class="field">
      <label for="n-t2">Sentence 2: What happens to the chain when a new hire leaves early?</label>
      <span class="hint" id="t2hint">Try starting with "When a new [role] leaves in their first weeks…"</span>
      <textarea id="n-t2" data-note="t2" aria-describedby="t2hint"></textarea>
    </div>
    <details class="example"><summary>See an example takeaway</summary>
      ${DECK.takeawayExample.map(t => `<p>${esc(t)}</p>`).join("")}
    </details>
    <p class="save-note">Your notes save in this browser as you type.</p>
    <div class="pdf-row">
      <button type="button" class="btn" id="pdfBtn">Download my notes (PDF)</button>
    </div>
    <p class="pdf-help">Download didn't start? <a href="#" id="fullLink" target="_blank" rel="noopener">Open this activity in a new tab<span class="sr-only"> (opens in a new tab)</span></a> and download it there. Your notes come with you.</p>
    <div class="sr-only" role="status" aria-live="polite" id="pdfStatus"></div>`;

  const outro = `
    <p class="eyebrow">What to remember</p>
    <h2 tabindex="-1">Three things to take with you</h2>
    <ol class="takeaways">${DECK.takeaways.map(t => `<li>${esc(t)}</li>`).join("")}</ol>
    <p class="finish">${esc(DECK.nextUp)}</p>
    <p class="next-hint"><span aria-hidden="true">↓ </span>You're done with this page. Scroll down and click the platform's <b>Next</b> button at the bottom of the page to save your progress.</p>`;

  const bodies = [...R.map(roleSlide), ...S.map(scenSlide), notesSlide, outro];
  $("slides").innerHTML = bodies.map((b, i) =>
    `<section class="slide" id="s${i}" aria-label="${esc(labels[i])}" hidden>${b}</section>`).join("");
  $("dots").innerHTML = labels.map((l, i) =>
    `<li><button type="button" class="dot" data-i="${i}" aria-label="Go to slide ${i + 1}: ${esc(l)}"></button></li>`).join("");

  /* ---------- checks ---------- */
  document.querySelectorAll("form[data-id]").forEach(f => f.addEventListener("submit", e => {
    e.preventDefault();
    const id = f.dataset.id, isScen = id[0] === "s", n = +id.slice(1);
    const c = isScen ? S[n] : R[n].check, fb = $("fb-" + id);
    const picked = f.querySelector("input:checked");
    if (!picked) { fb.innerHTML = `<div class="fb no"><p>Pick an answer first, then select Check answer.</p></div>`; return; }
    const right = +picked.value === c.answer;
    if (right && isScen) {
      fb.innerHTML = `<div class="fb ok"><p class="verdict"><span aria-hidden="true">✓</span>Correct. See what happens down the chain, below.</p></div>`;
      $("ripple-" + id).hidden = false;
    } else if (right) {
      fb.innerHTML = `<div class="fb ok"><p class="verdict"><span aria-hidden="true">✓</span>Correct.</p><p>${esc(c.why)}</p></div>`;
    } else {
      fb.innerHTML = `<div class="fb no"><p class="verdict"><span aria-hidden="true">↻</span>Not quite. Try another answer.</p></div>`;
    }
  }));

  /* ---------- notes: load, autosave ---------- */
  const fields = [...document.querySelectorAll("[data-note]")];
  let notes = {};
  try { notes = JSON.parse(localStorage.getItem(KEY + ":notes") || "{}") || {}; } catch (e) { notes = {}; }
  try {
    const m = HASH.match(/#notes=([^&]+)/);
    if (m) {
      notes = Object.assign(notes, JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1]))))));
      history.replaceState(null, "", location.pathname + location.search);
    }
  } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY + ":notes", JSON.stringify(notes)); } catch (e) {} };
  fields.forEach(el => {
    if (notes[el.dataset.note]) el.value = notes[el.dataset.note];
    el.addEventListener("input", () => { notes[el.dataset.note] = el.value; save(); });
  });
  save();

  $("fullLink").addEventListener("click", () => {
    const enc = encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(notes)))));
    $("fullLink").href = location.href.split("#")[0] + "#notes=" + enc + "&slide=notes";
  });

  /* ---------- PDF ---------- */
  const v = k => (notes[k] || "").trim();
  function sections() {
    const blank = "(left blank)";
    return [
      { h: "The four roles", items: R.map(r => ({
        title: r.name,
        lines: [`What they do: ${r.does}`, `Tools: ${r.tools}`, `My note, what breaks without them: ${v(r.key) || blank}`]
      })) },
      { h: "Break the chain", items: S.map(s => ({
        title: s.title,
        lines: [s.setup, ...s.ripple.map(([who, what]) => `${who}: ${what}`)]
      })) },
      { h: "My takeaway", items: [{ title: "", lines: [v("t1") || blank, v("t2") || blank] }] }
    ];
  }
  function printFallback() {
    const today = new Date().toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
    $("printout").innerHTML = `<h1>My FC Role Notes</h1><p>${esc(DECK.pdfProgram)} · ${esc(today)}</p>` +
      sections().map(sec => `<h2>${esc(sec.h)}</h2>` + sec.items.map(it =>
        `${it.title ? `<p><b>${esc(it.title)}</b></p>` : ""}<ul>${it.lines.map(l => `<li>${esc(l)}</li>`).join("")}</ul>`).join("")).join("");
    window.print();
  }
  $("pdfBtn").addEventListener("click", () => {
    const status = $("pdfStatus");
    try {
      if (!window.jspdf) throw new Error("no jspdf");
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: "pt", format: "letter" });
      doc.setProperties({ title: "My FC Role Notes", subject: DECK.pdfProgram });
      if (doc.setLanguage) doc.setLanguage("en-US");
      const M = 54, W = doc.internal.pageSize.getWidth() - M * 2, H = doc.internal.pageSize.getHeight();
      let y = M;
      const write = (text, size, style, gap, indent = 0) => {
        doc.setFont("helvetica", style); doc.setFontSize(size);
        const lines = doc.splitTextToSize(text, W - indent);
        lines.forEach(line => {
          if (y + size > H - M) { doc.addPage(); y = M; }
          doc.text(line, M + indent, y + size * .8); y += size * 1.35;
        });
        y += gap;
      };
      const today = new Date().toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
      write("My FC Role Notes", 20, "bold", 2);
      write(`${DECK.pdfProgram} · ${today}`, 10, "normal", 10);
      sections().forEach(sec => {
        write(sec.h, 14, "bold", 4);
        sec.items.forEach(it => {
          if (it.title) write(it.title, 11.5, "bold", 2);
          it.lines.forEach(l => write("• " + l, 10.5, "normal", 2, 8));
          y += 6;
        });
        y += 6;
      });
      doc.save("my-fc-role-notes.pdf");
      status.textContent = "Your PDF is downloading: my-fc-role-notes.pdf.";
    } catch (e) {
      status.textContent = "Opening your browser's print window. Choose Save as PDF.";
      printFallback();
    }
  });

  /* ---------- navigation ---------- */
  let cur = 0;
  const seen = new Set();
  function go(i, focus) {
    cur = Math.max(0, Math.min(total - 1, i));
    seen.add(cur);
    document.querySelectorAll(".slide").forEach((s, k) => s.hidden = k !== cur);
    document.querySelectorAll(".dot").forEach((d, k) => {
      d.classList.toggle("seen", seen.has(k));
      if (k === cur) d.setAttribute("aria-current", "step"); else d.removeAttribute("aria-current");
    });
    $("prevBtn").disabled = cur === 0;
    $("nextBtn").disabled = cur === total - 1;
    $("counter").textContent = `Slide ${cur + 1} of ${total}`;
    try { localStorage.setItem(KEY, cur); } catch (e) {}
    if (focus) {
      $("status").textContent = `Slide ${cur + 1} of ${total}: ${labels[cur]}`;
      $("s" + cur).querySelector("h2").focus();
    }
  }
  $("prevBtn").onclick = () => go(cur - 1, true);
  $("nextBtn").onclick = () => go(cur + 1, true);
  $("dots").onclick = e => { const b = e.target.closest(".dot"); if (b) go(+b.dataset.i, true); };
  let start = 0;
  try { start = +localStorage.getItem(KEY) || 0; } catch (e) {}
  if (/slide=notes/.test(HASH)) start = total - 2;
  go(start, false);
})();
</script>
</body>
</html>
