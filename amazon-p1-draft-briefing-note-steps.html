<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
================================================================================
TASK STEPS SLIDES — template (test format, 2026-10-19)
================================================================================
Design source: https://curious-tanuki-b3a260.netlify.app/ (Task view, the
"one step per slide" slider). The side and bottom panels from that design (people
panel, journey drawer, submission bar) are NOT here. Notion can't host them.

WHAT IT IS
  The steps of ONE task page, one step per slide. Each slide has:
    - a short instruction (1–3 sentences)
    - a sample (optional): what this step's output looks like, or code to copy
    - "You're on track if…" (one line)
    - "If you're stuck…" (1–2 bullets)
  An optional last slide shows how the task is evaluated.

HOW TO CUSTOMIZE
  Edit ONLY the TASK object below. Everything under "DO NOT EDIT" is the engine.
  - deckId: unique kebab-case slug (remembers the learner's place per task)
  - steps[]: 3–6 steps. Strings may contain simple inline HTML (<b>, <code>, <a>).
  - sample: { label, kind: "text" | "code", body }   (omit if the step has none)
  - items: [ "…", "…" ]   (optional) a numbered list shown right after the
    instruction, as a real <ol>. Use it for questions or ordered sub-steps; never
    fake a list with <br>.
  - evaluation: omit it entirely if the task isn't graded.
  The default content is the design's own example (dataset fitness), so the file
  opens as a working demo. Replace all of it.

DEPLOY
  github-pages-deployer → vpdasgupta/tiktok, then on the Notion task page:
  <embed src="https://vpdasgupta.github.io/tiktok/{program}-{task}-steps.html"></embed>
  Set the Notion embed height to about 960px. Keep the text fallback toggle on the
  page (see task-page-v2-template.md).

ACCESSIBILITY (WCAG 2.2 AA). Keep these patterns when editing:
  - Inactive slides use `hidden` (removed from the accessibility tree and tab order).
  - On Back/Next/dot navigation, focus moves to the new slide's heading.
  - A polite live region announces "Step K of N".
  - Progress dots are real buttons with aria-label and aria-current="step"; state is
    shown by shape and fill (not color alone) and the text counter.
  - All text ≥ 4.5:1, UI borders ≥ 3:1; visible focus ring; 44px targets.
  - Arrow keys change step except inside links and scrollable samples.
  - prefers-reduced-motion disables transitions. Reflows to one column ≤ 640px.

A11Y FIXES 2026-11-04 (engine only; TASK format unchanged):
  - Every link inside the slides opens in a new tab and says so: the engine adds
    target="_blank", rel="noopener", a visual ↗ (aria-hidden) and sr-only
    "(opens in a new tab)", same pattern as "See the example". Don't add these by hand.
  - Multi-line text samples (body contains "\n") render as a real list
    (<ul class="sample-text sample-lines" role="list">, one <li> per non-empty
    line, no bullets). Single-line samples stay a <p>. Code samples unchanged.
  - The "You're on track if…" / "If you're stuck…" labels use .check-label, so
    plain <b>/<strong> inside on-track and stuck text now renders inline.
  - Copy-code fallback (clipboard blocked): selects the code and announces
    "Code selected. Press Control+C or Command+C to copy."
  - Visible keyboard hint under the nav; aria-keyshortcuts="ArrowLeft ArrowRight"
    on the nav.
  - Evaluation table carries explicit table/rowgroup/row/columnheader/rowheader/cell
    roles, so it keeps table semantics when it reflows to blocks on narrow screens.
    Its row headers now use the full width at ≤ 420px (were squeezed to 30%).

RESKIN 2026-11-22 (CSS only; TASK content and engine unchanged):
  Moved from the cream/green "test format" palette (Inter) to the Amazon Supply
  Chain dark palette of the Step 1 decks (amazon-p1-fc-order-flow-check.html).
  Font: Amazon Ember → Helvetica Neue → Arial (Google Fonts Inter removed).
  Tokens: ink #0F141A canvas, panel #18202A, panel-2 #1F2935 (samples),
  line #2A3542 (decorative), edge #929292 (UI borders), text #F5F3EF,
  muted #B7B7B7, blue #1A98FF, blue-soft #7CC4FF, teal #36C2B4, lime #94ED88,
  gradient #1A98FF → #36C2B4 → #94ED88; focus ring lime 3px.
  Contrast (text ≥ 4.5:1): text on panel 14.8, on panel+glow corner 11.7,
  on panel-2 13.3; muted on panel 8.2 / glow 6.5 / panel-2 7.3 / ink 9.2;
  teal eyebrow on panel 7.5 / glow 5.9; links blue-soft on panel 8.8 /
  glow 6.9 / panel-2 7.9; "You're on track if" lime on lime tint #243433 9.1;
  "If you're stuck" blue-soft on blue tint #182E44 7.4; text on finish tint 12.0;
  #0F141A on #1A98FF Next button 6.15 (hover #7CC4FF 9.9).
  UI (≥ 3:1): edge #929292 on panel 5.3, on ink 5.9, on glow corner 4.2;
  seen dot #1A98FF on ink 6.15; focus #94ED88 on ink 13.0, on panel 11.5.
================================================================================
-->
<title>Task Steps</title>
<script>
/* ============================ EDIT THIS ============================ */
const TASK = {
  "deckId": "amazon-p1-draft-briefing-note-steps-v4",
  "title": "Draft a briefing note",
  "exampleUrl": "",
  "steps": [
    {
      "title": "What you'll hand in",
      "instruction": "You'll write a <b>300–400 word briefing note</b> that frames early attrition at an Amazon fulfillment center as a clear, urgent business problem. Keep the P1 Evidence Pack and your cost-of-turnover sheet open. The six parts and a full worked example are on the previous page, Learn How to Write a Briefing Note.",
      "sample": {
        "label": "Your 2 submissions",
        "kind": "text",
        "body": "1. Your briefing note as a PDF (upload)\n2. The link to your Google Doc\nTime: about 45 minutes (40 min draft, 5 min check and submit)"
      },
      "onTrack": "you know the 2 things you'll submit and have the Evidence Pack and your sheet open.",
      "stuck": [
        "Can't find your cost range? It's the sentence you wrote in the Estimate the Cost of Turnover task."
      ]
    },
    {
      "title": "Write your note",
      "instruction": "Open a new Google Doc and add the six headings from Learn How to Write a Briefing Note: Title, Context, Problem Statement, Why It Matters, Root Causes and Next Steps. Then write each section in your own words, with your own choice of figures and focus.",
      "sample": {
        "label": "What each section takes from your work",
        "kind": "text",
        "body": "Problem Statement: at least 2 Evidence Pack figures, with source and year\nWhy It Matters: your cost range and 90-day cost from Estimate the Cost of Turnover\nRoot Causes: 2–3 themes from the employee reviews you read in Step 2\nNext Steps: what to find out, not a fix"
      },
      "onTrack": "every section has at least one sentence, and Why It Matters gives your dollar range.",
      "stuck": [
        "Blank page? Reread the full worked example on Learn How to Write a Briefing Note, then close it and write. Borrow its structure, not its wording.",
        "Stuck on Root Causes? Pick two themes from the reviews on the \"Find Who's at Risk of Leaving\" task."
      ]
    },
    {
      "title": "Check against \"Done when\"",
      "instruction": "Before you export, check your note against these four lines.",
      "sample": {
        "label": "Done when",
        "kind": "text",
        "body": "Your note is 300–400 words and uses all six sections.\nIt cites at least 2 figures from the P1 Evidence Pack, each with source and year, worded as estimates where needed (\"reported,\" \"leaked\").\n\"Why It Matters\" gives your cost range from Estimate the Cost of Turnover.\n\"Next Steps\" names things to investigate, not a solution."
      },
      "onTrack": "you can tick all four lines.",
      "stuck": [
        "Over 400 words? Cut the Context first. It only needs 2–3 sentences."
      ]
    },
    {
      "title": "Export, share and submit",
      "instruction": "Submit 2 things in the task box below the steps:",
      "items": [
        "<b>Your briefing note as a PDF.</b> In Google Docs, click <b>File</b>, then <b>Download</b>, then <b>PDF Document (.pdf)</b>. Upload the file.",
        "<b>The link to your Google Doc.</b> Click <b>Share</b>, set General access to <i>Anyone with the link</i>, role <i>Viewer</i>, then <b>Copy link</b>."
      ],
      "sample": {
        "label": "Before you click submit",
        "kind": "text",
        "body": "Open your Doc link in a private browser window.\nCheck that it opens without asking you to sign in or request access."
      },
      "onTrack": "your Doc link opens in a private window and your PDF is attached.",
      "stuck": [
        "Link asks for access? Go back to <b>Share</b> and change General access from <i>Restricted</i> to <i>Anyone with the link</i>."
      ]
    }
  ],
  "evaluation": {
    "title": "How your note will be assessed",
    "intro": "Your note is reviewed against these four criteria.",
    "criteria": [
      {
        "name": "Problem framing",
        "lookFor": "The problem is named as a specific, bounded pattern (who, what, where, how much), not a vague complaint."
      },
      {
        "name": "Evidence use",
        "lookFor": "Cites at least 2 figures from the P1 Evidence Pack, each with source and year, and says when a figure is leaked or estimated. Uses the cost range from your cost-of-turnover estimate."
      },
      {
        "name": "Root-cause depth",
        "lookFor": "Offers two or three plausible, specific drivers and separates them from symptoms, without over-claiming certainty."
      },
      {
        "name": "Actionability",
        "lookFor": "Ends with clear next steps or questions that point toward investigation, not premature solutions."
      }
    ],
    "finish": "Done? Submit your PDF and Doc link in the task box below the steps."
  }
};
/* ======================= DO NOT EDIT BELOW ======================== */
</script>
<style>
  :root {
    --ink: #0F141A;       /* canvas */
    --panel: #18202A;
    --panel-2: #1F2935;
    --line: #2A3542;      /* decorative only */
    --edge: #929292;      /* UI borders, 5.3:1 on panel, 5.9:1 on ink */
    --text: #F5F3EF;      /* 14.8:1 on panel */
    --muted: #B7B7B7;     /* 8.2:1 on panel */
    --blue: #1A98FF;
    --blue-soft: #7CC4FF; /* 8.8:1 on panel, links + "stuck" label */
    --teal: #36C2B4;      /* 7.5:1 on panel */
    --lime: #94ED88;      /* 11.5:1 on panel, "on track" label */
    --glow: #0578FF;
    --grad: linear-gradient(90deg, #1A98FF, #36C2B4, #94ED88);
    --grad-v: linear-gradient(180deg, #1A98FF, #36C2B4, #94ED88);
    --focus: #94ED88;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    font-family: "Amazon Ember", "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: var(--ink);
    color: var(--text);
    line-height: 1.5;
    padding: 16px;
    -webkit-font-smoothing: antialiased;
  }
  button, a { font-family: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  .deck { max-width: 880px; margin: 0 auto; }
  .deck-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .deck-title { font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .btn-example {
    display: inline-flex; align-items: center; gap: 6px; min-height: 44px;
    border: 2px solid var(--edge); color: var(--text); background: transparent;
    border-radius: 999px; padding: 8px 16px; font-size: 14px; font-weight: 700; text-decoration: none;
  }
  .btn-example:hover { border-color: var(--text); }

  .slide {
    position: relative; overflow: hidden; overflow-wrap: anywhere;
    background: radial-gradient(520px 300px at 100% 0%, rgba(5,120,255,.20), transparent 65%),
                radial-gradient(420px 260px at 0% 100%, rgba(54,194,180,.10), transparent 65%), var(--panel);
    border: 1px solid var(--line); border-radius: 16px;
    padding: 28px 32px 30px;
  }
  .slide::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: var(--grad); }
  .step-num { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--teal); margin: 0; }
  .slide h2 { font-size: 24px; line-height: 1.25; font-weight: 800; margin: 6px 0 12px; }
  .slide h2:focus { outline: none; }
  .slide h2:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; border-radius: 4px; }
  .slide p { font-size: 16px; margin: 0 0 16px; }
  .slide a { color: var(--blue-soft); text-decoration: underline; text-underline-offset: 2px; }
  .slide a:hover { color: var(--text); }
  .step-items { font-size: 16px; margin: -8px 0 16px; padding-left: 24px; }
  .step-items li { margin-bottom: 6px; }
  .step-items li::marker { color: var(--teal); font-weight: 800; }
  code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .92em; background: var(--panel-2); color: var(--text); padding: 1px 5px; border-radius: 4px; }

  .sample { margin: 0 0 16px; }
  .sample-label { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  .sample-text {
    position: relative; margin: 0; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 16px 12px 20px; font-size: 15px; white-space: pre-wrap; overflow: hidden;
  }
  .sample-text::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--grad-v); }
  .slide .sample-label { font-size: 13px; }
  .sample-lines { list-style: none; white-space: normal; }
  .sample-lines li { margin: 0; padding: 0; white-space: pre-wrap; }
  .sample-lines li + li { margin-top: 4px; }
  .sample pre {
    margin: 0; background: var(--ink); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
    font-size: 14px; overflow-x: auto; font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .sample pre code { background: none; padding: 0; color: inherit; }
  .copy-btn {
    margin-top: 8px; min-height: 44px; border: 2px solid var(--edge); background: transparent; color: var(--text);
    border-radius: 999px; padding: 8px 16px; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .copy-btn:hover { border-color: var(--text); }

  .check { font-size: 15px; padding: 10px 16px; border-left: 4px solid; border-radius: 0 12px 12px 0; margin-bottom: 10px; }
  .check .check-label { display: block; font-size: 13px; font-weight: 800; letter-spacing: .02em; margin-bottom: 2px; }
  .check.ok { border-color: var(--lime); background: rgba(148,237,136,.10); }
  .check.ok .check-label { color: var(--lime); }
  .check.stuck { border-color: var(--blue-soft); background: rgba(26,152,255,.12); }
  .check.stuck .check-label { color: var(--blue-soft); }
  .check ul { margin: 4px 0 0; padding-left: 18px; }

  .eval-table { width: 100%; border-collapse: collapse; margin: 0 0 16px; font-size: 15px; background: rgba(15,20,26,.55); border-radius: 12px; overflow: hidden; }
  .eval-table caption { text-align: left; }
  .eval-table th, .eval-table td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .eval-table thead th { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .eval-table tbody th { width: 30%; color: var(--text); }
  .finish { border-left: 4px solid var(--teal); background: rgba(54,194,180,.12); border-radius: 0 12px 12px 0; padding: 12px 16px; font-weight: 700; margin: 0; }

  .slide-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; }
  .nav-btn {
    min-height: 44px; min-width: 44px; background: transparent; border: 2px solid var(--edge); color: var(--text);
    border-radius: 10px; padding: 9px 18px; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .nav-btn:hover:not(:disabled) { border-color: var(--text); }
  .nav-btn.primary { background: var(--blue); color: var(--ink); border-color: var(--blue); }
  .nav-btn.primary:hover:not(:disabled) { background: var(--blue-soft); border-color: var(--blue-soft); }
  .nav-btn:disabled { opacity: .4; cursor: default; }
  .dots { display: flex; gap: 2px; list-style: none; margin: 0; padding: 0; align-items: center; }
  .dot {
    /* 44px hit area around a small visual dot */
    width: 30px; height: 44px; border: 0; padding: 0; background: none; cursor: pointer;
    display: grid; place-items: center;
  }
  .dot::before { content: ""; width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--edge); background: transparent; }
  .dot.seen::before { border-color: var(--blue); background: var(--blue); } /* filled = visited, outline = not yet */
  .dot[aria-current="step"]::before { width: 28px; height: 14px; border-radius: 7px; border: 2px solid #FFFFFF; background: var(--grad); }
  .counter { font-size: 13px; color: var(--muted); text-align: center; margin-top: 6px; }
  .kbd-hint { font-size: 13px; color: var(--muted); text-align: center; margin: 2px 0 0; }

  @media (max-width: 420px) {
    .eval-table thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .eval-table tr, .eval-table th, .eval-table td { display: block; width: auto; }
    .eval-table tbody th { width: auto; padding-bottom: 0; border-bottom: 0; }
  }
  @media (max-width: 640px) {
    body { padding: 12px; }
    .slide { padding: 20px 18px 24px; }
    .slide h2 { font-size: 21px; }
    .slide-nav { flex-wrap: wrap; }
    .dots { order: -1; width: 100%; justify-content: center; }
    .nav-btn { flex: 1; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .slide:not([hidden]) { animation: in .25s ease; }
    @keyframes in { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: none; } }
  }
</style>
</head>
<body>
<main class="deck" aria-labelledby="deckTitle">
  <div class="deck-head">
    <h1 class="deck-title" id="deckTitle"></h1>
    <a class="btn-example" id="exampleLink" target="_blank" rel="noopener" hidden>See the example<span aria-hidden="true"> ↗</span><span class="sr-only"> (opens in a new tab)</span></a>
  </div>

  <div id="slides"></div>

  <nav class="slide-nav" aria-label="Task steps" aria-keyshortcuts="ArrowLeft ArrowRight">
    <button type="button" class="nav-btn" id="prevBtn"><span aria-hidden="true">← </span>Back</button>
    <ul class="dots" id="dots"></ul>
    <button type="button" class="nav-btn primary" id="nextBtn">Next step<span aria-hidden="true"> →</span></button>
  </nav>
  <p class="counter" id="counter" aria-hidden="true"></p>
  <p class="kbd-hint">Tip: use the <span aria-hidden="true">← and →</span><span class="sr-only">left and right arrow</span> keys to move between steps</p>
  <div class="sr-only" role="status" aria-live="polite" id="status"></div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const steps = TASK.steps, ev = TASK.evaluation;
  const total = steps.length + (ev ? 1 : 0);
  const KEY = "task-steps:" + TASK.deckId;

  $("deckTitle").textContent = TASK.title;
  document.title = TASK.title + " · Steps";
  if (TASK.exampleUrl) { $("exampleLink").href = TASK.exampleUrl; $("exampleLink").hidden = false; }

  const label = i => (ev && i === total - 1) ? "How it's evaluated" : `Step ${i + 1} of ${steps.length}`;

  function sampleHtml(s, i) {
    if (!s) return "";
    const lbl = `<p class="sample-label" id="sl-${i}">${s.label || "Sample"}</p>`;
    if (s.kind === "code") {
      const esc = s.body.replace(/&/g, "&amp;").replace(/</g, "&lt;");
      return `<div class="sample">${lbl}<pre role="region" tabindex="0" aria-labelledby="sl-${i}"><code>${esc}</code></pre>
        <button type="button" class="copy-btn" data-copy="${i}">Copy code</button></div>`;
    }
    if (s.body.includes("\n")) {
      const lines = s.body.split("\n").filter(l => l.trim());
      return `<div class="sample">${lbl}<ul class="sample-text sample-lines" role="list">${lines.map(l => `<li>${l}</li>`).join("")}</ul></div>`;
    }
    return `<div class="sample">${lbl}<p class="sample-text">${s.body}</p></div>`;
  }

  const html = steps.map((s, i) => `
    <section class="slide" aria-labelledby="h-${i}" hidden>
      <p class="step-num">${label(i)}</p>
      <h2 id="h-${i}" tabindex="-1">${s.title}</h2>
      <p>${s.instruction}</p>
      ${s.items && s.items.length ? `<ol class="step-items">${s.items.map(x => `<li>${x}</li>`).join("")}</ol>` : ""}
      ${sampleHtml(s.sample, i)}
      ${s.onTrack ? `<div class="check ok"><b class="check-label">You're on track if…</b>${s.onTrack}</div>` : ""}
      ${s.stuck && s.stuck.length ? `<div class="check stuck"><b class="check-label">If you're stuck…</b><ul>${s.stuck.map(x => `<li>${x}</li>`).join("")}</ul></div>` : ""}
    </section>`);

  if (ev) {
    const i = total - 1;
    html.push(`
    <section class="slide" aria-labelledby="h-${i}" hidden>
      <p class="step-num">${label(i)}</p>
      <h2 id="h-${i}" tabindex="-1">${ev.title || "How it will be evaluated"}</h2>
      ${ev.intro ? `<p>${ev.intro}</p>` : ""}
      <table class="eval-table" role="table">
        <caption class="sr-only">Evaluation criteria</caption>
        <thead role="rowgroup"><tr role="row"><th scope="col" role="columnheader">Criterion</th><th scope="col" role="columnheader">What reviewers look for</th></tr></thead>
        <tbody role="rowgroup">${ev.criteria.map(c => `<tr role="row"><th scope="row" role="rowheader">${c.name}</th><td role="cell">${c.lookFor}</td></tr>`).join("")}</tbody>
      </table>
      ${ev.finish ? `<p class="finish">${ev.finish}</p>` : ""}
    </section>`);
  }
  $("slides").innerHTML = html.join("");
  // Every link in the slides opens in a new tab, and says so (same pattern as "See the example").
  document.querySelectorAll("#slides a[href]").forEach(a => {
    a.target = "_blank";
    a.rel = "noopener";
    if (!/opens in a new tab/.test(a.textContent)) {
      a.insertAdjacentHTML("beforeend", '<span aria-hidden="true"> ↗</span><span class="sr-only"> (opens in a new tab)</span>');
    }
  });

  const slides = [...document.querySelectorAll(".slide")];
  $("dots").innerHTML = slides.map((_, i) =>
    `<li><button type="button" class="dot" data-step="${i}" aria-label="${label(i)}"></button></li>`).join("");
  const dots = [...document.querySelectorAll(".dot")];

  let step = 0, seen = 0, announceTimer;
  // Clear the live region, then set it after 40ms, so a repeated message is announced again.
  function announce(msg) {
    clearTimeout(announceTimer);
    $("status").textContent = "";
    announceTimer = setTimeout(() => { $("status").textContent = msg; }, 40);
  }
  try { const saved = JSON.parse(localStorage.getItem(KEY) || "{}"); step = saved.step || 0; seen = saved.seen || 0; } catch (e) {}

  function goTo(i, moveFocus) {
    step = Math.max(0, Math.min(total - 1, i));
    seen = Math.max(seen, step);
    slides.forEach((s, n) => s.hidden = n !== step);
    dots.forEach((d, n) => {
      d.classList.toggle("seen", n <= seen);
      d.setAttribute("aria-label", label(n) + (n !== step && n <= seen ? ", visited" : ""));
      if (n === step) d.setAttribute("aria-current", "step"); else d.removeAttribute("aria-current");
    });
    $("prevBtn").disabled = step === 0;
    const last = step === total - 1;
    $("nextBtn").disabled = last;
    $("nextBtn").innerHTML = last ? "Last step" : 'Next step<span aria-hidden="true"> →</span>';
    $("counter").textContent = label(step);
    if (moveFocus) { $("h-" + step).focus(); announce(label(step)); }
    try { localStorage.setItem(KEY, JSON.stringify({ step, seen })); } catch (e) {}
  }

  $("prevBtn").onclick = () => goTo(step - 1, true);
  $("nextBtn").onclick = () => goTo(step + 1, true);
  dots.forEach(d => d.onclick = () => goTo(+d.dataset.step, true));
  document.addEventListener("keydown", e => {
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    if (e.target.closest("a, pre, input, textarea")) return;
    if (e.key === "ArrowRight" && step < total - 1) { e.preventDefault(); goTo(step + 1, true); }
    if (e.key === "ArrowLeft" && step > 0) { e.preventDefault(); goTo(step - 1, true); }
  });
  document.addEventListener("click", async e => {
    const b = e.target.closest("[data-copy]");
    if (!b) return;
    let msg;
    try { await navigator.clipboard.writeText(steps[+b.dataset.copy].sample.body); b.textContent = msg = "Copied"; }
    catch (err) {
      // Clipboard blocked (e.g. inside an embed): select the code so the learner can copy it.
      const code = b.closest(".sample").querySelector("pre code");
      const range = document.createRange();
      range.selectNodeContents(code);
      const sel = window.getSelection();
      sel.removeAllRanges(); sel.addRange(range);
      b.textContent = "Code selected";
      msg = "Code selected. Press Control+C or Command+C to copy.";
    }
    announce(msg);
    setTimeout(() => b.textContent = "Copy code", 2500);
  });

  goTo(step, false);
})();
</script>
</body>
</html>
