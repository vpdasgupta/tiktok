<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
================================================================================
TRAINING CHECK DECK: Follow one order through a fulfillment center (2026-11-21)
================================================================================
Reinforces the order-flow video on the [Training] page "Learn How Fulfillment
Centers Power Amazon's Business" (Amazon P1 Step 1, working copy).

Slides: 1 animated flow (five steps, role tags on Stow/Pick/Pack) → 1 roles slide
(Stower, Picker, Packer) → 5 quick checks → 1 takeaways slide.
Edit only the DECK object. Checks are practice: never graded, never gated.

STYLE: Amazon Supply Chain palette, same as the page banners (gen-banners.py) and
amazon-p0-themes-and-tools.html: squid ink #0F141A canvas, panel #18202A,
#0578FF glow, gradient #1A98FF → #36C2B4 → #94ED88, text #F5F3EF, muted #B7B7B7,
open dots #929292. Font: Amazon Ember → Helvetica Neue → Arial.
Contrast on #18202A: #F5F3EF 15.1, #B7B7B7 8.3, #94ED88 11.6, #7CC4FF 8.6,
#929292 5.3 (UI borders); #0F141A on #1A98FF button 6.15.

ANIMATED FLOW (slide 1): the five steps are a real <ol>, so the text is always
in the accessibility tree in order. JS lights each station in turn (track fills,
a box drops into the active station). Decorative parts are aria-hidden.
  - Pause / Play button (WCAG 2.2.2). Stops after 3 loops on its own.
  - prefers-reduced-motion: no autoplay, all stations shown lit.
  - Horizontal at ≥ 641px, vertical below.

ACCESSIBILITY (WCAG 2.2 AA):
  - Inactive slides use `hidden`; on Back/Next/dot navigation focus moves to the
    new slide's heading; a polite live region announces "Slide K of N".
  - Each check is a native <fieldset>/<legend> radio group plus a "Check answer"
    button. Feedback goes into an aria-live="polite" region present on load.
    Right/wrong is said in words and by icon shape, never by color alone.
  - No arrow-key slide shortcuts, so radio groups keep native arrow keys.
  - Visible focus ring (lime, 3px), 44px targets, reflows at 320px.
  - The last slide points to the platform's own Next button (plain text, no link).
================================================================================
-->
<title>Follow One Order</title>
<script>
/* ============================ EDIT THIS ============================ */
const DECK = {
  deckId: "amazon-p1-fc-order-flow-check",
  title: "Follow one order through a fulfillment center",
  flow: [
    { name: "Receive", cap: "Items arrive", icon: "receive" },
    { name: "Stow", cap: "Scanned into a bin", icon: "stow", role: "Stower" },
    { name: "Pick", cap: "Pulled for an order", icon: "pick", role: "Picker" },
    { name: "Pack", cap: "Boxed and labeled", icon: "pack", role: "Packer" },
    { name: "Ship", cap: "Onto the truck", icon: "ship" }
  ],
  roles: {
    title: "Three steps, three roles",
    intro: "Stow, pick and pack aren't just steps. Each one is a job that associates do every shift.",
    cards: [
      { role: "Stower", icon: "stow", does: "Puts each new item in a storage bin and scans it.",
        handoff: "Gives the Picker an item that's in the bin the system shows." },
      { role: "Picker", icon: "pick", does: "Pulls the items for each order from their bins.",
        handoff: "Depends on the Stower. Sends the right items on to the Packer." },
      { role: "Packer", icon: "pack", does: "Puts each order in the right box and labels it.",
        handoff: "Depends on the Picker. Sends a labeled box on to the truck." }
    ],
    why: "These are the roles you'll look at closely in this externship to find ways to improve employee outcomes."
  },
  checks: [
    {
      step: "Stow",
      question: "A Stower puts a phone into a storage bin. Why do they scan it?",
      options: [
        "So the system knows which bin the phone is in",
        "To print the shipping label",
        "To tell the customer their order is on the way"
      ],
      answer: 0,
      why: "The scan at stow is what lets every later step find the item. If the scan and the bin don't match, the next person feels it."
    },
    {
      step: "Pick",
      question: "A Picker goes to the bin the system shows, but the phone isn't there. Which step most likely went wrong first?",
      options: ["Pack", "Stow", "Ship"],
      answer: 1,
      why: "A Picker can only find what the Stower put in the right bin. A mistake at one step often shows up at the next one."
    },
    {
      step: "Roles",
      question: "An associate pulls a phone from its bin and puts it in a tote for an order. What's their role?",
      options: ["Stower", "Packer", "Picker"],
      answer: 2,
      why: "Stower, Picker and Packer each match one step: stow, pick and pack. You'll look closely at these three roles in this externship."
    },
    {
      step: "People and machines",
      question: "Robots move storage pods and conveyors carry totes. Which is true about the people on the floor?",
      options: [
        "They only watch the robots",
        "They keep the system flexible, and they're also where errors and delays can start, especially when someone is new",
        "They're there only for jobs that robots will soon take over"
      ],
      answer: 1,
      why: "People and machines hand work to each other at every step. That's why how fast new associates learn matters so much."
    },
    {
      step: "Hand-offs",
      question: "A customer orders a phone and gets a different model. The Picker scanned the bin the system showed. Where could the mix-up have started?",
      options: [
        "At stow: two similar phones went into the same bin",
        "At ship: the truck went to the wrong city",
        "At receive: the customer typed the wrong address"
      ],
      answer: 0,
      why: "The Picker did their part, so look one hand-off back. A rushed or new Stower who puts look-alike items together can cause a wrong item two steps later."
    }
  ],
  takeaways: [
    "Every order moves through five steps: receive, stow, pick, pack, ship.",
    "Stow, pick and pack are also roles: Stower, Picker and Packer. Each depends on the one before. The Picker can only find what the Stower scanned into the right bin.",
    "People keep the system flexible, and they're also where mistakes can start, especially when they're new. That's why you'll look closely at these three roles to find ways to improve employee outcomes."
  ],
  nextUp: "Next, you'll meet the Learning Ambassadors who train new associates on the floor."
};
/* ======================= DO NOT EDIT BELOW ======================== */
</script>
<style>
  :root {
    --ink: #0F141A;
    --panel: #18202A;
    --panel-2: #1F2935;
    --line: #2A3542;      /* decorative only */
    --edge: #929292;      /* UI borders, 5.3:1 on panel */
    --text: #F5F3EF;
    --muted: #B7B7B7;
    --blue: #1A98FF;
    --blue-soft: #7CC4FF;
    --teal: #36C2B4;
    --lime: #94ED88;
    --glow: #0578FF;
    --grad: linear-gradient(90deg, #1A98FF, #36C2B4, #94ED88);
    --focus: #94ED88;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    font-family: "Amazon Ember", "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: var(--ink); color: var(--text);
    line-height: 1.5; padding: 16px; -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  .deck { max-width: 880px; margin: 0 auto; }
  .deck-title { font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
  .slide {
    position: relative; overflow: hidden; overflow-wrap: anywhere;
    background: radial-gradient(520px 300px at 100% 0%, rgba(5,120,255,.20), transparent 65%),
                radial-gradient(420px 260px at 0% 100%, rgba(54,194,180,.10), transparent 65%), var(--panel);
    border: 1px solid var(--line); border-radius: 16px; padding: 28px 32px 30px;
  }
  .slide::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: var(--grad); }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--teal); margin: 0; }
  .slide h2 { font-size: 24px; line-height: 1.25; font-weight: 800; margin: 6px 0 12px; }
  .slide h2:focus { outline: none; }
  .slide h2:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; border-radius: 4px; }
  .slide p { font-size: 16px; margin: 0 0 16px; }
  .muted { color: var(--muted); }

  /* ---------- animated flow ---------- */
  .flowviz { list-style: none; margin: 8px 0 18px; padding: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .st { position: relative; text-align: center; padding-top: 30px; }
  .ring {
    position: relative; z-index: 1; width: 84px; height: 84px; margin: 0 auto 10px; border-radius: 50%;
    display: grid; place-items: center; color: var(--muted);
    background: var(--panel-2); border: 3px solid #4A5664;
    transition: border-color .4s, color .4s, box-shadow .4s, transform .4s;
  }
  .ring svg { width: 40px; height: 40px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .st b { display: block; font-size: 17px; font-weight: 800; color: var(--muted); transition: color .4s; }
  .st .cap { display: block; font-size: 14px; color: var(--muted); }
  .num { position: absolute; z-index: 2; top: 26px; left: calc(50% + 22px); width: 26px; height: 26px; border-radius: 50%;
    background: var(--ink); border: 2px solid #4A5664; color: var(--muted); font-size: 13px; font-weight: 800; display: grid; place-items: center;
    transition: background .4s, color .4s, border-color .4s; }
  /* track between stations */
  .track { position: absolute; z-index: 0; top: 70px; left: calc(50% + 42px); width: calc(100% - 84px + 8px); height: 4px; border-radius: 2px; background: #2F3B49; overflow: hidden; }
  .track i { position: absolute; inset: 0; background: var(--grad); transform: scaleX(0); transform-origin: left; transition: transform .9s ease-in-out; }
  /* the box that drops into the active station */
  .pkg { position: absolute; z-index: 2; top: 0; left: 50%; width: 22px; height: 22px; margin-left: -11px; opacity: 0; }
  .pkg svg { width: 22px; height: 22px; }

  .st.done .ring { border-color: var(--blue); color: var(--text); }
  .st.done .num { background: var(--blue); border-color: var(--blue); color: var(--ink); }
  .st.done b { color: var(--text); }
  .st.done .track i { transform: scaleX(1); }
  .st.active .ring { border-color: var(--lime); color: var(--lime); box-shadow: 0 0 0 6px rgba(148,237,136,.14), 0 0 28px rgba(54,194,180,.45); transform: scale(1.06); }
  .st.active .num { background: var(--lime); border-color: var(--lime); color: var(--ink); }
  .st.active b { color: var(--lime); }
  .st.active .pkg { animation: drop .7s ease-out forwards; }
  @keyframes drop { 0% { opacity: 0; transform: translateY(-14px); } 60% { opacity: 1; transform: translateY(6px); } 100% { opacity: 1; transform: translateY(2px); } }

  .flow-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0 0 14px; }
  .ghost-btn { min-height: 44px; border: 2px solid var(--edge); background: transparent; color: var(--text);
    border-radius: 999px; padding: 8px 16px; font-size: 14px; font-weight: 700; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
  .ghost-btn:hover { border-color: var(--text); }


  /* role tag on flow stations */
  .role-tag { display: inline-flex; align-items: center; gap: 5px; margin-top: 6px; padding: 3px 10px 3px 8px; border-radius: 999px;
    font-size: 13px; font-weight: 800; color: var(--text); background: rgba(15,20,26,.7); border: 1.5px solid var(--teal); }
  .role-tag svg { width: 13px; height: 13px; fill: none; stroke: var(--teal); stroke-width: 1.8; stroke-linecap: round; }
  .st.active .role-tag { border-color: var(--lime); }
  .st.active .role-tag svg { stroke: var(--lime); }

  /* roles slide */
  .roles { list-style: none; margin: 0 0 16px; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .role { position: relative; background: rgba(15,20,26,.55); border: 1px solid var(--line); border-radius: 14px; padding: 16px 16px 14px; overflow: hidden; }
  .role::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--grad); }
  .role-icon { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; color: var(--ink); background: var(--grad); margin-bottom: 10px; }
  .role-icon svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .role h3 { margin: 0; font-size: 20px; font-weight: 800; }
  .role .role-step { margin: 0 0 10px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--teal); }
  .role dl { margin: 0; font-size: 15px; }
  .role dt { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 8px; }
  .role dd { margin: 2px 0 0; }

  /* ---------- quick check ---------- */
  fieldset { border: 0; margin: 0 0 14px; padding: 0; min-width: 0; }
  legend { font-size: 19px; font-weight: 700; line-height: 1.35; margin: 0 0 14px; padding: 0; }
  .opt { display: flex; gap: 12px; align-items: flex-start; min-height: 44px; padding: 11px 14px; margin-bottom: 8px;
    border: 2px solid var(--edge); border-radius: 12px; cursor: pointer; font-size: 16px; background: rgba(15,20,26,.55); }
  .opt:hover { border-color: var(--text); }
  .opt input { width: 20px; height: 20px; margin: 2px 0 0; flex: none; accent-color: var(--teal); }
  .opt:has(input:checked) { border-color: var(--teal); background: rgba(54,194,180,.14); }
  .opt:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
  .opt input:focus-visible { outline: none; }
  .check-btn { min-height: 44px; border: 0; background: var(--blue); color: var(--ink);
    border-radius: 10px; padding: 10px 20px; font-size: 15px; font-weight: 800; cursor: pointer; }
  .check-btn:hover { background: var(--blue-soft); }
  .feedback { margin-top: 14px; }
  .fb { border-left: 4px solid; border-radius: 0 12px 12px 0; padding: 12px 16px; }
  .fb p { margin: 0; font-size: 15px; }
  .fb p + p { margin-top: 6px; }
  .fb .verdict { font-weight: 800; display: flex; gap: 8px; align-items: center; }
  .fb.ok { border-color: var(--lime); background: rgba(148,237,136,.10); }
  .fb.ok .verdict { color: var(--lime); }
  .fb.no { border-color: var(--blue-soft); background: rgba(26,152,255,.12); }
  .fb.no .verdict { color: var(--blue-soft); }

  /* ---------- takeaways ---------- */
  .takeaways { list-style: none; margin: 0 0 18px; padding: 0; counter-reset: t; display: grid; gap: 10px; }
  .takeaways li { counter-increment: t; display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: start; font-size: 16px;
    background: rgba(15,20,26,.55); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .takeaways li::before { content: counter(t); width: 32px; height: 32px; border-radius: 8px; background: var(--grad); color: var(--ink);
    font-weight: 800; display: grid; place-items: center; }
  .finish { border-left: 4px solid var(--teal); background: rgba(54,194,180,.12); border-radius: 0 12px 12px 0; padding: 12px 16px; font-weight: 700; margin: 0 0 12px; }
  .next-hint { border: 2px dashed var(--edge); border-radius: 12px; padding: 12px 16px; font-size: 15px; margin: 0; color: var(--muted); }
  .next-hint b { color: var(--text); }

  /* ---------- nav ---------- */
  .slide-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; }
  .nav-btn { min-height: 44px; min-width: 44px; background: transparent; border: 2px solid var(--edge); color: var(--text);
    border-radius: 10px; padding: 9px 18px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .nav-btn:hover:not(:disabled) { border-color: var(--text); }
  .nav-btn.primary { background: var(--blue); color: var(--ink); border-color: var(--blue); }
  .nav-btn.primary:hover:not(:disabled) { background: var(--blue-soft); border-color: var(--blue-soft); }
  .nav-btn:disabled { opacity: .4; cursor: default; }
  .dots { display: flex; gap: 2px; list-style: none; margin: 0; padding: 0; align-items: center; }
  .dot { width: 30px; height: 44px; border: 0; padding: 0; background: none; cursor: pointer; display: grid; place-items: center; }
  .dot::before { content: ""; width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--edge); background: transparent; }
  .dot.seen::before { border-color: var(--blue); background: var(--blue); }
  .dot[aria-current="step"]::before { width: 28px; height: 14px; border-radius: 7px; border: 2px solid #FFFFFF; background: var(--grad); }
  .counter { font-size: 13px; color: var(--muted); text-align: center; margin-top: 6px; }

  @media (max-width: 640px) {
    body { padding: 12px; }
    .slide { padding: 20px 18px 24px; }
    .slide h2 { font-size: 21px; }
    .flowviz { grid-template-columns: 1fr; gap: 14px; }
    .roles { grid-template-columns: 1fr; }
    .st .role-tag { align-self: flex-start; }
    .st { text-align: left; padding: 0 0 0 108px; min-height: 72px; display: flex; flex-direction: column; justify-content: center; }
    .ring { position: absolute; left: 28px; top: 0; width: 64px; height: 64px; margin: 0; }
    .ring svg { width: 30px; height: 30px; }
    .num { top: -4px; left: 76px; width: 22px; height: 22px; font-size: 12px; }
    .track { top: 64px; left: 58px; width: 4px; height: calc(100% - 64px + 14px); }
    .track i { transform: scaleY(0); transform-origin: top; }
    .st.done .track i { transform: scaleY(1); }
    .pkg { left: 0; top: 21px; margin-left: 0; }
    @keyframes drop { 0% { opacity: 0; transform: translateX(-10px); } 60% { opacity: 1; transform: translateX(4px); } 100% { opacity: 1; transform: translateX(2px); } }
    .slide-nav { flex-wrap: wrap; }
    .dots { order: -1; width: 100%; justify-content: center; }
    .nav-btn { flex: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ring, .track i, .num, .st b { transition: none; }
    .st.active .pkg { animation: none; opacity: 1; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .slide:not([hidden]) { animation: in .25s ease; }
    @keyframes in { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: none; } }
  }
</style>
</head>
<body>
<main class="deck" aria-labelledby="deckTitle">
  <h1 class="deck-title" id="deckTitle"></h1>
  <div id="slides"></div>
  <nav class="slide-nav" aria-label="Slides">
    <button type="button" class="nav-btn" id="prevBtn"><span aria-hidden="true">← </span>Back</button>
    <ul class="dots" id="dots"></ul>
    <button type="button" class="nav-btn primary" id="nextBtn">Next<span aria-hidden="true"> →</span></button>
  </nav>
  <p class="counter" id="counter" aria-hidden="true"></p>
  <div class="sr-only" role="status" aria-live="polite" id="status"></div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const C = DECK.checks, F = DECK.flow;
  const R = DECK.roles;
  const total = C.length + 3;
  const KEY = "fc-check:" + DECK.deckId;
  $("deckTitle").textContent = DECK.title;

  const ICONS = {
    receive: '<path d="M5 18 20 8l15 10v16H5z"/><path d="M12 34V24h16v10"/><path d="M16 29h8"/>',
    stow: '<rect x="6" y="6" width="28" height="28" rx="2"/><path d="M6 15.3h28M6 24.6h28M15.3 6v28M24.6 6v28"/><rect x="17.5" y="17.5" width="5" height="5" fill="currentColor"/>',
    pick: '<path d="M5 16h30l-3.5 17h-23z"/><path d="M14 16v-5a6 6 0 0 1 12 0v5"/><path d="M15 23v5M20 23v5M25 23v5"/>',
    pack: '<path d="M6 13 20 6l14 7v15l-14 7-14-7z"/><path d="M6 13l14 7 14-7M20 20v15"/>',
    ship: '<path d="M3 10h20v18H3zM23 16h8l5 6v6H23z"/><circle cx="10" cy="30" r="3.5"/><circle cx="29" cy="30" r="3.5"/>'
  };
  const PKG = '<svg viewBox="0 0 22 22" aria-hidden="true"><rect x="2" y="4" width="18" height="15" rx="2" fill="#94ED88"/><path d="M2 9h18M11 4v5" stroke="#0F141A" stroke-width="2"/></svg>';

  const PERSON = '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5" r="3"/><path d="M2.5 15c0-3.3 2.5-5.5 5.5-5.5s5.5 2.2 5.5 5.5"/></svg>';
  const labels = ["The five steps", "The three roles", ...C.map((c, i) => `Quick check ${i + 1} of ${C.length}`), "What to remember"];

  const intro = `
    <p class="eyebrow">${labels[0]}</p>
    <h2 tabindex="-1">Watch one order move through the building</h2>
    <ol class="flowviz" id="flowviz">${F.map((f, i) => `
      <li class="st">
        <span class="pkg" aria-hidden="true">${PKG}</span>
        <span class="ring" aria-hidden="true"><svg viewBox="0 0 40 40">${ICONS[f.icon]}</svg></span>
        <span class="num" aria-hidden="true">${i + 1}</span>
        <b>${f.name}</b><span class="cap">${f.cap}</span>
        ${f.role ? `<span class="role-tag"><span class="sr-only">Role: </span>${PERSON}${f.role}</span>` : ""}
        ${i < F.length - 1 ? '<span class="track" aria-hidden="true"><i></i></span>' : ""}
      </li>`).join("")}
    </ol>
    <div class="flow-controls">
      <button type="button" class="ghost-btn" id="flowBtn"></button>
      <span class="muted">Each step hands work to the next. Three of them are roles: Stower, Picker and Packer.</span>
    </div>
    <p>Next, meet the three roles.</p>`;

  const rolesSlide = `
    <p class="eyebrow">${labels[1]}</p>
    <h2 tabindex="-1">${R.title}</h2>
    <p>${R.intro}</p>
    <ul class="roles">${R.cards.map((r, i) => `
      <li class="role">
        <span class="role-icon" aria-hidden="true"><svg viewBox="0 0 40 40">${ICONS[r.icon]}</svg></span>
        <h3>${r.role}</h3>
        <p class="role-step">Step ${i + 2}: ${F[i + 1].name}</p>
        <dl>
          <dt>Does</dt><dd>${r.does}</dd>
          <dt>Hand-off</dt><dd>${r.handoff}</dd>
        </dl>
      </li>`).join("")}
    </ul>
    <p class="finish">${R.why}</p>
    <p class="muted">Next come ${C.length} quick checks. They aren't graded, so try each one and read why.</p>`;

  const checkHtml = (c, i) => `
    <p class="eyebrow">${c.step}</p>
    <h2 tabindex="-1">${labels[i + 2]}</h2>
    <form data-q="${i}" novalidate>
      <fieldset>
        <legend>${c.question}</legend>
        ${c.options.map((o, j) => `<label class="opt"><input type="radio" name="q${i}" value="${j}"><span>${o}</span></label>`).join("")}
      </fieldset>
      <button type="submit" class="check-btn">Check answer</button>
      <div class="feedback" id="fb-${i}" aria-live="polite"></div>
    </form>`;

  const outro = `
    <p class="eyebrow">${labels[total - 1]}</p>
    <h2 tabindex="-1">Three things to take with you</h2>
    <ol class="takeaways">${DECK.takeaways.map(t => `<li><span>${t}</span></li>`).join("")}</ol>
    <p class="finish">${DECK.nextUp}</p>
    <p class="next-hint"><span aria-hidden="true">↓ </span>You're done with this page. Scroll down and click the platform's <b>Next</b> button at the bottom of the page to save your progress.</p>`;

  const bodies = [intro, rolesSlide, ...C.map(checkHtml), outro];
  $("slides").innerHTML = bodies.map((b, i) =>
    `<section class="slide" id="s${i}" aria-label="${labels[i]}" hidden>${b}</section>`).join("");
  $("dots").innerHTML = labels.map((l, i) =>
    `<li><button type="button" class="dot" data-i="${i}" aria-label="Go to slide ${i + 1}: ${l}"></button></li>`).join("");

  /* ---- flow animation ---- */
  const stations = [...document.querySelectorAll("#flowviz .st")];
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let phase = 0, loops = 0, timer = null;
  const paint = p => stations.forEach((s, k) => {
    s.classList.toggle("done", k < p);
    s.classList.toggle("active", k === p);
  });
  const showAll = () => paint(F.length);
  function tick() {
    phase++;
    if (phase > F.length + 1) {          // held on "all done", restart
      loops++;
      if (loops >= 3) { stop(); return; }
      phase = 0;
    }
    paint(Math.min(phase, F.length));
  }
  function play() {
    if (timer) return;
    if (phase >= F.length) { phase = 0; loops = 0; }
    paint(phase);
    timer = setInterval(tick, 1500);
    setBtn();
  }
  function stop() { clearInterval(timer); timer = null; showAll(); phase = F.length; setBtn(); }
  function setBtn() {
    const b = $("flowBtn");
    b.innerHTML = timer ? '<span aria-hidden="true">❚❚</span> Pause animation' : '<span aria-hidden="true">▶</span> Play animation';
  }
  $("flowBtn").onclick = () => timer ? stop() : play();

  document.querySelectorAll("form[data-q]").forEach(f => f.addEventListener("submit", e => {
    e.preventDefault();
    const i = +f.dataset.q, c = C[i], fb = $("fb-" + i);
    const picked = f.querySelector("input:checked");
    if (!picked) { fb.innerHTML = `<div class="fb no"><p>Pick an answer first, then select Check answer.</p></div>`; return; }
    const right = +picked.value === c.answer;
    fb.innerHTML = right
      ? `<div class="fb ok"><p class="verdict"><span aria-hidden="true">✓</span>Correct.</p><p>${c.why}</p></div>`
      : `<div class="fb no"><p class="verdict"><span aria-hidden="true">↻</span>Not quite. Try another answer.</p></div>`;
  }));

  let cur = 0;
  const seen = new Set();
  function go(i, focus) {
    cur = Math.max(0, Math.min(total - 1, i));
    seen.add(cur);
    document.querySelectorAll(".slide").forEach((s, k) => s.hidden = k !== cur);
    document.querySelectorAll(".dot").forEach((d, k) => {
      d.classList.toggle("seen", seen.has(k));
      if (k === cur) d.setAttribute("aria-current", "step"); else d.removeAttribute("aria-current");
    });
    $("prevBtn").disabled = cur === 0;
    $("nextBtn").disabled = cur === total - 1;
    $("counter").textContent = `Slide ${cur + 1} of ${total}`;
    try { localStorage.setItem(KEY, cur); } catch (e) {}
    if (cur === 0 && !reduce) play(); else if (timer) stop();
    if (focus) {
      $("status").textContent = `Slide ${cur + 1} of ${total}: ${labels[cur]}`;
      $("s" + cur).querySelector("h2").focus();
    }
  }
  $("prevBtn").onclick = () => go(cur - 1, true);
  $("nextBtn").onclick = () => go(cur + 1, true);
  $("dots").onclick = e => { const b = e.target.closest(".dot"); if (b) go(+b.dataset.i, true); };
  showAll(); phase = F.length; setBtn();
  let start = 0;
  try { start = +localStorage.getItem(KEY) || 0; } catch (e) {}
  go(start, false);
})();
</script>
</body>
</html>
