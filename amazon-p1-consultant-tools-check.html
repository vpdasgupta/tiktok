<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
================================================================================
TRAINING CHECK DECK: Three tools consultants use (2026-11-22)
================================================================================
Replaces the H5P image-hotspot embed ("click each (+) to see the three tools
consultants use to report causes and possible fixes") on the [Training] page
"Know How Consultants Turn Problems into Actionable Steps" (Amazon P1 Step 3,
working copy). Content comes from the H5P capture 1292651628939040289.

Slides: 1 intro (the three tools at a glance) → 3 tool cards (briefing note,
stakeholder map, root cause analysis) → 3 quick checks → 1 takeaways slide.
Edit only the DECK object. Checks are practice: never graded, never gated.

STYLE: same as amazon-p1-fc-order-flow-check.html (Amazon P1 Step 1).
Amazon Supply Chain palette: squid ink #0F141A canvas, panel #18202A,
#0578FF glow, gradient #1A98FF → #36C2B4 → #94ED88, text #F5F3EF, muted #B7B7B7,
UI borders #929292. Font: Amazon Ember → Helvetica Neue → Arial.
Contrast on #18202A: #F5F3EF 15.1, #B7B7B7 8.3, #94ED88 11.6, #7CC4FF 8.6,
#36C2B4 7.4, #929292 5.3 (UI borders); #0F141A on #1A98FF button 6.15.
Line icons are inline SVG, aria-hidden, inside gradient badges.

ACCESSIBILITY (WCAG 2.2 AA):
  - Inactive slides use `hidden`; on Back/Next/dot navigation focus moves to the
    new slide's heading; a polite live region announces "Slide K of N".
  - Each check is a native <fieldset>/<legend> radio group plus a "Check answer"
    button. Feedback goes into an aria-live="polite" region present on load.
    Right/wrong is said in words and by icon shape, never by color alone.
    Retry is allowed.
  - No arrow-key slide shortcuts, so radio groups keep native arrow keys.
  - Visible focus ring (lime, 3px), 44px targets, reflows at 320px,
    prefers-reduced-motion respected.
  - The last slide points to the platform's own Next button (plain text, no link).
================================================================================
-->
<title>Three Consultant Tools</title>
<script>
/* ============================ EDIT THIS ============================ */
const DECK = {
  deckId: "amazon-p1-consultant-tools-check",
  title: "Three tools consultants use",
  intro: {
    title: "How consultants report causes and fixes",
    lead: "Consultants investigate first. Then they state the problem clearly: who is affected, how much, and where to look next.",
    after: "They use three tools to do that. Next, look at each one up close."
  },
  tools: [
    {
      name: "Briefing note", icon: "brief",
      short: "One page on what's happening and why it matters.",
      what: "A one-page summary of the core of a complex issue.",
      when: "When decision-makers need to understand a problem fast and act on it.",
      has: "What is happening. Why it matters. Early hypotheses and next steps.",
      example: "Turnover among entry-level associates has gone up 25% in 3 months. That means higher training costs, slower production and customer delays.",
      note: "You'll use the briefing note in this step."
    },
    {
      name: "Stakeholder map", icon: "map",
      short: "Who's involved, who's affected and who can make change.",
      what: "A diagram of the people around a problem: who's involved, who's affected and who has the power to make change.",
      when: "When planning conversations, spotting blockers and designing fixes that work for people, not just numbers.",
      has: "Key roles. Decision-makers. Influencers. Disconnects between groups.",
      example: "HR, shift managers, team leads, Learning Ambassadors and floor associates. Operations Directors decide. Respected team leads influence. The map might show an HR process no one on the floor uses."
    },
    {
      name: "Root cause analysis", icon: "root",
      short: "Digs past symptoms to the real cause.",
      what: "A step-by-step way to find the real cause of a problem, not just the symptoms.",
      when: "Before choosing a fix, so the fix goes after what will actually make a difference.",
      has: "Methods like the 5 Whys. A fishbone diagram sorts causes into groups like People, Processes, Tools and Culture.",
      whys: [
        ["Why are people quitting?", "They're burned out."],
        ["Why are they burned out?", "They work back-to-back shifts."],
        ["Why are shifts back-to-back?", "The scheduling system isn't set up well."],
        ["Why isn't it set up well?", "No one reviews workload patterns after launch."],
        ["Why not?", "It isn't part of manager training or metrics."]
      ]
    }
  ],
  checks: [
    {
      step: "Which tool fits?",
      question: "You need to know who decides on shift schedules and which team leads people listen to. Which tool helps most?",
      options: ["Briefing note", "Stakeholder map", "Root cause analysis"],
      answer: 1,
      why: "A stakeholder map shows who's involved, who's affected and who has the power to make change. It tells you who to talk to first."
    },
    {
      step: "Vague or specific?",
      question: "Which problem statement gives a leader more to act on?",
      options: [
        "Retention is a problem, and too many people are leaving.",
        "New pickers on night shift leave twice as often in their first 90 days as day-shift pickers, and most exits come in the week after training ends.",
        "Night shift is hard, and people don't like it."
      ],
      answer: 1,
      why: "It says who is affected (new night-shift pickers), how much (twice as often) and where to look next (the week after training ends)."
    },
    {
      step: "Dig deeper",
      question: "Exit interviews keep mentioning pay. What does root cause analysis tell you to do next?",
      options: [
        "Recommend a raise right away",
        "Keep asking why until you reach a cause you can act on",
        "Write a briefing note that says pay is the problem"
      ],
      answer: 1,
      why: "In the McKinsey restaurant case, pay wasn't the root cause. Career development, store culture and shift length were. Asking why again keeps you from fixing only a symptom."
    }
  ],
  takeaways: [
    "A briefing note puts the core of a problem on one page: what's happening, why it matters and what to do next.",
    "A stakeholder map shows who can make change. Root cause analysis digs past symptoms to the real cause.",
    "A strong problem statement says who is affected, how much and where to look next. You'll use the briefing note in this step."
  ]
};
/* ======================= DO NOT EDIT BELOW ======================== */
</script>
<style>
  :root {
    --ink: #0F141A;
    --panel: #18202A;
    --panel-2: #1F2935;
    --line: #2A3542;      /* decorative only */
    --edge: #929292;      /* UI borders, 5.3:1 on panel */
    --text: #F5F3EF;
    --muted: #B7B7B7;
    --blue: #1A98FF;
    --blue-soft: #7CC4FF;
    --teal: #36C2B4;
    --lime: #94ED88;
    --glow: #0578FF;
    --grad: linear-gradient(90deg, #1A98FF, #36C2B4, #94ED88);
    --focus: #94ED88;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    font-family: "Amazon Ember", "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: var(--ink); color: var(--text);
    line-height: 1.5; padding: 16px; -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  .deck { max-width: 880px; margin: 0 auto; }
  .deck-title { font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
  .slide {
    position: relative; overflow: hidden; overflow-wrap: anywhere;
    background: radial-gradient(520px 300px at 100% 0%, rgba(5,120,255,.20), transparent 65%),
                radial-gradient(420px 260px at 0% 100%, rgba(54,194,180,.10), transparent 65%), var(--panel);
    border: 1px solid var(--line); border-radius: 16px; padding: 28px 32px 30px;
  }
  .slide::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: var(--grad); }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--teal); margin: 0; }
  .slide h2 { font-size: 24px; line-height: 1.25; font-weight: 800; margin: 6px 0 12px; }
  .slide h2:focus { outline: none; }
  .slide h2:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; border-radius: 4px; }
  .slide p { font-size: 16px; margin: 0 0 16px; }
  .muted { color: var(--muted); }

  /* ---------- gradient icon badges ---------- */
  .badge { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; color: var(--ink); background: var(--grad); flex: none; }
  .badge svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .badge.lg { width: 64px; height: 64px; border-radius: 16px; }
  .badge.lg svg { width: 38px; height: 38px; }

  /* ---------- intro: three tools at a glance ---------- */
  .tools { list-style: none; margin: 4px 0 18px; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .tool { position: relative; background: rgba(15,20,26,.55); border: 1px solid var(--line); border-radius: 14px; padding: 16px 16px 14px; overflow: hidden; }
  .tool::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--grad); }
  .tool .badge { margin-bottom: 10px; }
  .tool h3 { margin: 0 0 4px; font-size: 19px; font-weight: 800; }
  .tool .num { margin: 0 0 2px; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--teal); }
  .tool p { font-size: 15px; margin: 0; color: var(--muted); }

  /* ---------- tool card slide ---------- */
  .card-head { display: flex; gap: 16px; align-items: center; margin: 4px 0 16px; }
  .card-head h2 { margin: 2px 0 0; }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 0 0 14px; }
  .fact { background: rgba(15,20,26,.55); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .fact h3 { margin: 0 0 4px; font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .fact p { margin: 0; font-size: 15px; }
  .example { border-left: 4px solid var(--teal); background: rgba(54,194,180,.12); border-radius: 0 12px 12px 0; padding: 12px 16px; margin: 0 0 12px; }
  .example h3 { margin: 0 0 4px; font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--teal); }
  .example p { margin: 0; font-size: 16px; }
  .whys { list-style: none; margin: 6px 0 0; padding: 0; counter-reset: w; display: grid; gap: 6px; }
  .whys li { counter-increment: w; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; font-size: 15px; }
  .whys li::before { content: counter(w); width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--teal); color: var(--text); font-size: 13px; font-weight: 800; display: grid; place-items: center; }
  .whys b { font-weight: 700; }
  .note { font-weight: 700; margin: 0; }
  .note .tick { color: var(--lime); }

  /* ---------- quick check ---------- */
  fieldset { border: 0; margin: 0 0 14px; padding: 0; min-width: 0; }
  legend { font-size: 19px; font-weight: 700; line-height: 1.35; margin: 0 0 14px; padding: 0; }
  .opt { display: flex; gap: 12px; align-items: flex-start; min-height: 44px; padding: 11px 14px; margin-bottom: 8px;
    border: 2px solid var(--edge); border-radius: 12px; cursor: pointer; font-size: 16px; background: rgba(15,20,26,.55); }
  .opt:hover { border-color: var(--text); }
  .opt input { width: 20px; height: 20px; margin: 2px 0 0; flex: none; accent-color: var(--teal); }
  .opt:has(input:checked) { border-color: var(--teal); background: rgba(54,194,180,.14); }
  .opt:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
  .opt input:focus-visible { outline: none; }
  .check-btn { min-height: 44px; border: 0; background: var(--blue); color: var(--ink);
    border-radius: 10px; padding: 10px 20px; font-size: 15px; font-weight: 800; cursor: pointer; }
  .check-btn:hover { background: var(--blue-soft); }
  .feedback { margin-top: 14px; }
  .fb { border-left: 4px solid; border-radius: 0 12px 12px 0; padding: 12px 16px; }
  .fb p { margin: 0; font-size: 15px; }
  .fb p + p { margin-top: 6px; }
  .fb .verdict { font-weight: 800; display: flex; gap: 8px; align-items: center; }
  .fb.ok { border-color: var(--lime); background: rgba(148,237,136,.10); }
  .fb.ok .verdict { color: var(--lime); }
  .fb.no { border-color: var(--blue-soft); background: rgba(26,152,255,.12); }
  .fb.no .verdict { color: var(--blue-soft); }

  /* ---------- takeaways ---------- */
  .takeaways { list-style: none; margin: 0 0 18px; padding: 0; counter-reset: t; display: grid; gap: 10px; }
  .takeaways li { counter-increment: t; display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: start; font-size: 16px;
    background: rgba(15,20,26,.55); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .takeaways li::before { content: counter(t); width: 32px; height: 32px; border-radius: 8px; background: var(--grad); color: var(--ink);
    font-weight: 800; display: grid; place-items: center; }
  .next-hint { border: 2px dashed var(--edge); border-radius: 12px; padding: 12px 16px; font-size: 15px; margin: 0; color: var(--muted); }
  .next-hint b { color: var(--text); }

  /* ---------- nav ---------- */
  .slide-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; }
  .nav-btn { min-height: 44px; min-width: 44px; background: transparent; border: 2px solid var(--edge); color: var(--text);
    border-radius: 10px; padding: 9px 18px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .nav-btn:hover:not(:disabled) { border-color: var(--text); }
  .nav-btn.primary { background: var(--blue); color: var(--ink); border-color: var(--blue); }
  .nav-btn.primary:hover:not(:disabled) { background: var(--blue-soft); border-color: var(--blue-soft); }
  .nav-btn:disabled { opacity: .4; cursor: default; }
  .dots { display: flex; gap: 2px; list-style: none; margin: 0; padding: 0; align-items: center; }
  .dot { width: 30px; height: 44px; border: 0; padding: 0; background: none; cursor: pointer; display: grid; place-items: center; }
  .dot::before { content: ""; width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--edge); background: transparent; }
  .dot.seen::before { border-color: var(--blue); background: var(--blue); }
  .dot[aria-current="step"]::before { width: 28px; height: 14px; border-radius: 7px; border: 2px solid #FFFFFF; background: var(--grad); }
  .counter { font-size: 13px; color: var(--muted); text-align: center; margin-top: 6px; }

  @media (max-width: 760px) {
    .facts { grid-template-columns: 1fr; }
  }
  @media (max-width: 640px) {
    body { padding: 12px; }
    .slide { padding: 20px 18px 24px; }
    .slide h2 { font-size: 21px; }
    .tools { grid-template-columns: 1fr; }
    .badge.lg { width: 52px; height: 52px; border-radius: 13px; }
    .badge.lg svg { width: 30px; height: 30px; }
    .slide-nav { flex-wrap: wrap; }
    .dots { order: -1; width: 100%; justify-content: center; }
    .nav-btn { flex: 1; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .slide:not([hidden]) { animation: in .25s ease; }
    @keyframes in { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: none; } }
  }
</style>
</head>
<body>
<main class="deck" aria-labelledby="deckTitle">
  <h1 class="deck-title" id="deckTitle"></h1>
  <div id="slides"></div>
  <nav class="slide-nav" aria-label="Slides">
    <button type="button" class="nav-btn" id="prevBtn"><span aria-hidden="true">← </span>Back</button>
    <ul class="dots" id="dots"></ul>
    <button type="button" class="nav-btn primary" id="nextBtn">Next<span aria-hidden="true"> →</span></button>
  </nav>
  <p class="counter" id="counter" aria-hidden="true"></p>
  <div class="sr-only" role="status" aria-live="polite" id="status"></div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const C = DECK.checks, T = DECK.tools, I = DECK.intro;
  const total = 1 + T.length + C.length + 1;
  const KEY = "tools-check:" + DECK.deckId;
  $("deckTitle").textContent = DECK.title;

  const ICONS = {
    /* one-page note with lines and a check */
    brief: '<path d="M10 4h15l7 7v25H10z"/><path d="M25 4v7h7"/><path d="M15 18h12M15 23h12M15 28h6"/><path d="m23 29 2.5 2.5L30 27"/>',
    /* people linked to a central decision-maker */
    map: '<circle cx="20" cy="20" r="5"/><circle cx="7" cy="9" r="3.5"/><circle cx="33" cy="9" r="3.5"/><circle cx="7" cy="31" r="3.5"/><circle cx="33" cy="31" r="3.5"/><path d="m10 11.5 6 5M30 11.5l-6 5M10 28.5l6-5M30 28.5l-6-5"/>',
    /* magnifier over a branching cause tree */
    root: '<circle cx="17" cy="17" r="11"/><path d="m25 25 10 10"/><path d="M17 10v6M17 16l-4 5M17 16l4 5"/>'
  };
  const badge = (icon, cls = "") => `<span class="badge ${cls}" aria-hidden="true"><svg viewBox="0 0 40 40">${ICONS[icon]}</svg></span>`;

  const labels = ["The three tools", ...T.map((t, i) => `Tool ${i + 1} of ${T.length}: ${t.name}`),
    ...C.map((c, i) => `Quick check ${i + 1} of ${C.length}`), "What to remember"];

  const intro = `
    <p class="eyebrow">${labels[0]}</p>
    <h2 tabindex="-1">${I.title}</h2>
    <p>${I.lead}</p>
    <ul class="tools">${T.map((t, i) => `
      <li class="tool">
        ${badge(t.icon)}
        <p class="num">Tool ${i + 1}</p>
        <h3>${t.name}</h3>
        <p>${t.short}</p>
      </li>`).join("")}
    </ul>
    <p class="muted">${I.after}</p>`;

  const toolSlide = (t, i) => `
    <p class="eyebrow">Tool ${i + 1} of ${T.length}</p>
    <div class="card-head">${badge(t.icon, "lg")}<h2 tabindex="-1">${t.name}</h2></div>
    <div class="facts">
      <div class="fact"><h3>What it is</h3><p>${t.what}</p></div>
      <div class="fact"><h3>When consultants use it</h3><p>${t.when}</p></div>
      <div class="fact"><h3>What's in it</h3><p>${t.has}</p></div>
    </div>
    <div class="example">
      <h3>Amazon FC example</h3>
      ${t.whys
        ? `<p>The 5 Whys on high turnover:</p><ol class="whys">${t.whys.map(w => `<li><span><b>${w[0]}</b> ${w[1]}</span></li>`).join("")}</ol>`
        : `<p>${t.example}</p>`}
    </div>
    ${t.note ? `<p class="note"><span class="tick" aria-hidden="true">✓ </span>${t.note}</p>` : ""}`;

  const checkHtml = (c, i) => `
    <p class="eyebrow">${c.step}</p>
    <h2 tabindex="-1">${labels[1 + T.length + i]}</h2>
    <form data-q="${i}" novalidate>
      <fieldset>
        <legend>${c.question}</legend>
        ${c.options.map((o, j) => `<label class="opt"><input type="radio" name="q${i}" value="${j}"><span>${o}</span></label>`).join("")}
      </fieldset>
      <button type="submit" class="check-btn">Check answer</button>
      <div class="feedback" id="fb-${i}" aria-live="polite"></div>
    </form>`;

  const outro = `
    <p class="eyebrow">${labels[total - 1]}</p>
    <h2 tabindex="-1">Three things to take with you</h2>
    <ol class="takeaways">${DECK.takeaways.map(t => `<li><span>${t}</span></li>`).join("")}</ol>
    <p class="next-hint"><span aria-hidden="true">↓ </span>You're done with this interactive. Scroll down and click the platform's <b>Next</b> button at the bottom of the page to save your progress.</p>`;

  const bodies = [intro, ...T.map(toolSlide), ...C.map(checkHtml), outro];
  $("slides").innerHTML = bodies.map((b, i) =>
    `<section class="slide" id="s${i}" aria-label="${labels[i]}" hidden>${b}</section>`).join("");
  $("dots").innerHTML = labels.map((l, i) =>
    `<li><button type="button" class="dot" data-i="${i}" aria-label="Go to slide ${i + 1}: ${l}"></button></li>`).join("");

  document.querySelectorAll("form[data-q]").forEach(f => f.addEventListener("submit", e => {
    e.preventDefault();
    const i = +f.dataset.q, c = C[i], fb = $("fb-" + i);
    const picked = f.querySelector("input:checked");
    if (!picked) { fb.innerHTML = `<div class="fb no"><p>Pick an answer first, then select Check answer.</p></div>`; return; }
    const right = +picked.value === c.answer;
    fb.innerHTML = right
      ? `<div class="fb ok"><p class="verdict"><span aria-hidden="true">✓</span>Correct.</p><p>${c.why}</p></div>`
      : `<div class="fb no"><p class="verdict"><span aria-hidden="true">↻</span>Not quite. Try another answer.</p></div>`;
  }));

  let cur = 0;
  const seen = new Set();
  function go(i, focus) {
    cur = Math.max(0, Math.min(total - 1, i));
    seen.add(cur);
    document.querySelectorAll(".slide").forEach((s, k) => s.hidden = k !== cur);
    document.querySelectorAll(".dot").forEach((d, k) => {
      d.classList.toggle("seen", seen.has(k));
      if (k === cur) d.setAttribute("aria-current", "step"); else d.removeAttribute("aria-current");
    });
    $("prevBtn").disabled = cur === 0;
    $("nextBtn").disabled = cur === total - 1;
    $("counter").textContent = `Slide ${cur + 1} of ${total}`;
    try { localStorage.setItem(KEY, cur); } catch (e) {}
    if (focus) {
      $("status").textContent = `Slide ${cur + 1} of ${total}: ${labels[cur]}`;
      $("s" + cur).querySelector("h2").focus();
    }
  }
  $("prevBtn").onclick = () => go(cur - 1, true);
  $("nextBtn").onclick = () => go(cur + 1, true);
  $("dots").onclick = e => { const b = e.target.closest(".dot"); if (b) go(+b.dataset.i, true); };
  let start = 0;
  try { start = +localStorage.getItem(KEY) || 0; } catch (e) {}
  go(start, false);
})();
</script>
</body>
</html>
